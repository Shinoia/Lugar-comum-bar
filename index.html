<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugar Comum Bar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #dc2626; color: #000; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #b91c1c; border-bottom: 2px solid #991b1b; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        h1 { font-size: 1.5rem; font-weight: bold; color: #000; }
        .nav-buttons { display: flex; gap: 0.5rem; background: #b91c1c; padding: 0.25rem; border-radius: 0.75rem; border: 2px solid #7f1d1d; align-items: center; }
        button { cursor: pointer; border: none; font-weight: bold; font-size: 0.875rem; border-radius: 0.5rem; padding: 0.5rem 1rem; color: #000; }
        .btn-tab { background: transparent; color: #1e1b4b; }
        .active-caixa { background: #facc15; color: #000; }
        .active-cozinha { background: #f97316; color: #000; }
        .active-bar { background: #38bdf8; color: #000; }
        .active-abertas { background: #c4b5fd; color: #000; }
        .btn-dia { background: #4ade80; border: 2px solid #000; }
        main { flex: 1; padding: 1.5rem; display: block; }
        .grid-caixa { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media(min-width: 1024px) { .grid-caixa { grid-template-columns: 2fr 1fr; } }
        .mesas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        @media(min-width: 640px) { .mesas-grid { grid-template-columns: repeat(4, 1fr); } }
        .mesa-card { background: #ef4444; border: 2px solid #b91c1c; border-radius: 0.75rem; padding: 1rem; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 8rem; color: #000; }
        .mesa-card.ocupada { border-color: #000; background: #f87171; }
        .mesa-card.selecionada { border-color: #000; box-shadow: 0 0 0 3px rgba(0,0,0,0.3); }
        .painel-lateral { background: #b91c1c; border: 2px solid #991b1b; border-radius: 1rem; padding: 1.25rem; display: flex; flex-direction: column; color: #000; }
        .form-grupo { background: #ef4444; padding: 0.75rem; border-radius: 0.75rem; border: 2px solid #b91c1c; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        select, input { background: #fff; border: 2px solid #000; border-radius: 0.5rem; padding: 0.5rem; font-size: 0.875rem; width: 100%; font-weight: bold; color: #000; }
        .btn-lancar { background: #facc15; font-weight: bold; width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 2px solid #000; color: #000; }
        .lista-itens { flex: 1; overflow-y: auto; max-height: 14rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .item-row { background: #ef4444; padding: 0.75rem; border-radius: 0.5rem; border: 2px solid #b91c1c; display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; color: #000; }
        .kds-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 1rem; }
        @media(min-width: 768px) { .kds-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 1024px) { .kds-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .kds-card { padding: 1rem; border-radius: 0.75rem; border: 2px solid #991b1b; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 12rem; background: #f472b6; color: #000; }
        .kds-card.preparando { background: #f97316; }
        .kds-card.pronto { background: #4ade80; }
        .kds-card.entregue { background: #facc15; }

        .badge { padding: 0.125rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold; background: #fff; color: #000; }
        .btn-acao-entregue { background: #fff; border: 2px solid #000; border-radius: 0.4rem; padding: 0.3rem 0.5rem; font-size: 0.75rem; font-weight: bold; color: #000; text-align: center; }
        .sync-status { font-size: 0.75rem; font-weight: bold; background: #4ade80; padding: 0.25rem 0.5rem; border-radius: 0.25rem; border: 1px solid #000; color: #000; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>🍺 Lugar Comum Bar</h1>
            <span id="sync-indicator" class="sync-status">Sistema Ativo</span>
        </div>
        <div class="nav-buttons">
            <button id="btn-aba-caixa" class="btn-tab active-caixa" onclick="mudarAba('caixa')">🧮 Caixa / Mesas</button>
            <button id="btn-aba-cozinha" class="btn-tab" onclick="mudarAba('cozinha')">🍳 Cozinha</button>
            <button id="btn-aba-bar" class="btn-tab" onclick="mudarAba('bar')">🍻 Bar</button>
            <button id="btn-aba-abertas" class="btn-tab" onclick="mudarAba('abertas')">📋 Abertas</button>
            <button class="btn-dia" onclick="finalizarDia()">🏁 Finalizar Dia</button>
        </div>
    </header>

    <main id="app-conteudo"></main>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycbwvI5hgSTG-T0EpHk9pNHqe31ex0P9EQb_TixFis94UcaHF45F-SWS2T3fBfPedMRY7/exec";

        // Cardápio de segurança preenchido para garantir funcionamento imediato
        var CARDAPIO = [
            { nome: "Refrigerante", preco: 6.00, estoque: 50, tipo: "bar" },
            { nome: "Kariri", preco: 10.00, estoque: 30, tipo: "bar" },
            { nome: "Conserva", preco: 15.00, estoque: 20, tipo: "cozinha" }
        ];
        
        var estado = {
            abaAtiva: 'caixa',
            mesaSelecionadaId: null,
            produtoSelecionadoCache: 'Refrigerante',
            quantidadeCache: 1,
            pedidosGlobais: [],
            pendentes: [],
            overrides: {},
            mesas: [],
            pessoas: [],
            pessoasNovas: []
        };
        var PREFIXO_PESSOA = 'Pessoa: ';

        for (var i = 1; i <= 16; i++) {
            estado.mesas.push({ id: i, status: 'livre', itens: [], contadorFehamentos: 0 });
        }

        var CORES_STATUS = { pendente: '#f472b6', preparando: '#f97316', pronto: '#4ade80', entregue: '#facc15' };
        function corStatus(st) { return CORES_STATUS[st] || '#fff'; }

        // chave estável de um pedido na lista (mesa + produto + horário + ocorrência)
        function chavePedido(lista, idx) {
            var q0 = lista[idx];
            var base = String(q0.mesa) + '|' + q0.produto + '|' + String(q0.oi || '');
            var n = 0;
            for (var i = 0; i < idx; i++) {
                var q = lista[i];
                if (String(q.mesa) + '|' + q.produto + '|' + String(q.oi || '') === base) n++;
            }
            return base + '|' + n;
        }

        function esc(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function brl(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function ehPessoa(chave) { return String(chave).indexOf(PREFIXO_PESSOA) === 0; }
        function limparNome(n) {
            return String(n || '').replace(/[.|<>&"'`=+@\\]/g, ' ').replace(/\s+/g, ' ').trim().substring(0, 30);
        }
        function todasMesas() { return estado.mesas.concat(estado.pessoas); }
        function acharMesa(id) { return todasMesas().find(function(m) { return String(m.id) === String(id); }); }
        // nome para mostrar na tela
        function nomeMesa(m) {
            if (m.pessoa) return '👤 ' + m.nome;
            var r = m.idExibicao || m.id;
            if (m.status === 'livre' && m.contadorFehamentos > 0) r = m.id + '.' + m.contadorFehamentos;
            return 'Mesa ' + r;
        }
        // identificador gravado na coluna A da planilha para novos pedidos
        function chaveMesa(m) {
            if (m.pessoa) return m.id;
            if (m.status === 'livre' && m.contadorFehamentos > 0) return m.id + '.' + m.contadorFehamentos;
            if (m.status === 'ocupada' && m.idExibicao) return m.idExibicao;
            return m.id;
        }
        function totalMesaObj(m) {
            var t = 0;
            for (var i = 0; i < m.itens.length; i++) t += m.itens[i].qnt * m.itens[i].preco;
            return t;
        }

        function itemEhCozinha(it) {
            var t = String(it.tipo || 'bar').toLowerCase();
            return t.indexOf('cozinha') >= 0 || t.indexOf('petisco') >= 0 || t.indexOf('comida') >= 0;
        }
        // cor do grupo (bar ou cozinha) da mesa: pronto > preparando > pendente > entregue; branco = sem itens
        function corGrupo(itens, cozinha) {
            var sts = itens.filter(function(it) { return itemEhCozinha(it) === cozinha; })
                           .map(function(it) { return it.statusPreparo || 'pendente'; });
            if (sts.length === 0) return '#fff';
            return corStatus(sts.indexOf('pronto') >= 0 ? 'pronto' : sts.indexOf('preparando') >= 0 ? 'preparando' : sts.indexOf('pendente') >= 0 ? 'pendente' : 'entregue');
        }
        function bolinha(rotulo, cor) {
            return '<span style="background:' + cor + '; border: 2px solid #000; border-radius: 999px; padding: 0 0.4rem; font-size: 0.65rem; font-weight: bold; color: #000; display: inline-block; line-height: 1.1rem; margin-left: 0.25rem;">' + rotulo + '</span>';
        }

        // estoque disponível = estoque da planilha - pedidos enviados que o servidor ainda não gravou
        function estoqueDisponivel(nome) {
            var p = CARDAPIO.find(function(x) { return x.nome === nome; });
            if (!p) return 0;
            var reservado = 0;
            estado.pendentes.forEach(function(pd) {
                if (pd.pedido.produto === nome) reservado += Number(pd.pedido.qnt) || 0;
            });
            return (Number(p.estoque) || 0) - reservado;
        }
        function primeiroDisponivel() {
            for (var c = 0; c < CARDAPIO.length; c++) {
                if (estoqueDisponivel(CARDAPIO[c].nome) > 0) return CARDAPIO[c].nome;
            }
            return CARDAPIO.length > 0 ? CARDAPIO[0].nome : '';
        }
        function desfazerPedido(novo, mensagem) {
            estado.pendentes = estado.pendentes.filter(function(pd) { return pd.pedido !== novo; });
            estado.pedidosGlobais = estado.pedidosGlobais.filter(function(x) { return x !== novo; });
            processarPedidos();
            renderizar();
            alert(mensagem);
            sincronizar();
        }

        function processarPedidos() {
            try {
                for (var i = 0; i < estado.mesas.length; i++) {
                    estado.mesas[i].itens = [];
                    estado.mesas[i].status = 'livre';
                    estado.mesas[i].contadorFehamentos = 0;
                    estado.mesas[i].idExibicao = null;
                    estado.mesas[i].abertaEm = '';
                }

                var contagemFechamentos = {};
                var fechSets = {};
                var pessoasMapa = {};

                for (var k = 0; k < estado.pedidosGlobais.length; k++) {
                    var p = estado.pedidosGlobais[k];
                    if (!p || !p.mesa) continue;
                    var baseId = String(p.mesa).split('.')[0];
                    var mesaObj = estado.mesas.find(function(m) { return m.id == baseId; });
                    if (ehPessoa(p.mesa)) {
                        if (p.status === 'fechado') continue;
                        if (!pessoasMapa[p.mesa]) {
                            pessoasMapa[p.mesa] = { id: p.mesa, pessoa: true, nome: String(p.mesa).substring(PREFIXO_PESSOA.length), status: 'ocupada', itens: [], idExibicao: p.mesa, contadorFehamentos: 0, abertaEm: p.oi || '' };
                        }
                        mesaObj = pessoasMapa[p.mesa];
                        var pc = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                        mesaObj.itens.push({ idItem: k, produto: p.produto, qnt: Number(p.qnt || 1), preco: pc ? pc.preco : (p.preco || 0), tipo: p.tipo || 'bar', statusPreparo: p.statusPreparo || 'pendente', linha: p.linha, mesaKey: p.mesa });
                        continue;
                    }

                    if (mesaObj) {
                        if (p.status === 'fechado') {
                            fechSets[baseId] = fechSets[baseId] || {};
                            fechSets[baseId][String(p.tchau)] = true;
                            contagemFechamentos[baseId] = Object.keys(fechSets[baseId]).length;
                            mesaObj.status = 'livre';
                        } else {
                            mesaObj.status = 'ocupada';
                            mesaObj.idExibicao = p.mesa;
                            if (!mesaObj.abertaEm) mesaObj.abertaEm = p.oi || '';
                            
                            var prodCard = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                            var precoUnit = prodCard ? prodCard.preco : (p.preco || 6.00);

                            mesaObj.itens.push({
                                idItem: k,
                                produto: p.produto,
                                qnt: Number(p.qnt || 1),
                                preco: precoUnit,
                                tipo: p.tipo || 'bar',
                                statusPreparo: p.statusPreparo || 'pendente',
                                linha: p.linha,
                                mesaKey: p.mesa
                            });
                        }
                    }
                }

                // pessoas: as que têm pedidos em aberto + as cadastradas que ainda não pediram
                estado.pessoas = [];
                for (var chv2 in pessoasMapa) estado.pessoas.push(pessoasMapa[chv2]);
                estado.pessoasNovas.forEach(function(nome) {
                    var chave = PREFIXO_PESSOA + nome;
                    if (!pessoasMapa[chave]) {
                        estado.pessoas.push({ id: chave, pessoa: true, nome: nome, status: 'ocupada', itens: [], idExibicao: chave, contadorFehamentos: 0, abertaEm: '' });
                    }
                });
                estado.pessoas.sort(function(a, b) { return a.nome.localeCompare(b.nome, 'pt'); });

                for (var mId in contagemFechamentos) {
                    var mObj = estado.mesas.find(function(m) { return m.id == mId; });
                    if (mObj && mObj.status === 'livre') {
                        mObj.contadorFehamentos = contagemFechamentos[mId];
                    }
                }
            } catch (err) {
                console.log("Erro ao processar pedidos:", err);
            }
        }

        function capturarValoresFormulario() {
            try {
                var sel = document.getElementById('select-produto');
                var qtd = document.getElementById('input-qtd');
                if (sel && sel.value) estado.produtoSelecionadoCache = sel.value;
                if (qtd && qtd.value) estado.quantidadeCache = qtd.value;
            } catch (err) {}
        }

        function sincronizar() {
            capturarValoresFormulario();
            fetch(API_URL)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data) {
                        if (data.produtos && data.produtos.length > 0) {
                            CARDAPIO = data.produtos;
                        }
                        if (data.pedidos) {
                            estado.pedidosGlobais = data.pedidos;
                            // pedidos enviados que o servidor ainda não gravou continuam na tela
                            estado.pendentes = estado.pendentes.filter(function(pd) {
                                if (Date.now() - pd.t > 60000) return false;
                                var n = data.pedidos.filter(function(x) { return x.status !== 'fechado' && String(x.mesa) === String(pd.pedido.mesa) && x.produto === pd.pedido.produto; }).length;
                                return n < pd.base + 1;
                            });
                            estado.pendentes.forEach(function(pd) { data.pedidos.push(pd.pedido); });
                            // mudanças de status feitas aqui e ainda não confirmadas pelo servidor
                            for (var kk = 0; kk < data.pedidos.length; kk++) {
                                var chv = chavePedido(data.pedidos, kk);
                                var ov = estado.overrides[chv];
                                if (!ov) continue;
                                var pk = data.pedidos[kk];
                                var servidorTemStatus = ('statusPreparo' in pk);
                                if (servidorTemStatus && (pk.statusPreparo === ov.status || Date.now() - ov.t > 60000)) {
                                    delete estado.overrides[chv];
                                } else {
                                    pk.statusPreparo = ov.status;
                                }
                            }
                            processarPedidos();
                        }
                        renderizar();
                    }
                })
                .catch(function(e) { 
                    console.log("Aviso de rede (usando dados locais):", e); 
                    renderizar(); 
                });
        }

        function mudarAba(aba) {
            estado.abaAtiva = aba;
            if (aba === 'caixa') {
                estado.mesaSelecionadaId = null;
            }
            
            var btnCaixa = document.getElementById('btn-aba-caixa');
            var btnCozinha = document.getElementById('btn-aba-cozinha');
            var btnBar = document.getElementById('btn-aba-bar');
            var btnAbertas = document.getElementById('btn-aba-abertas');

            if (btnCaixa) btnCaixa.className = "btn-tab " + (aba === 'caixa' ? 'active-caixa' : '');
            if (btnCozinha) btnCozinha.className = "btn-tab " + (aba === 'cozinha' ? 'active-cozinha' : '');
            if (btnBar) btnBar.className = "btn-tab " + (aba === 'bar' ? 'active-bar' : '');
            if (btnAbertas) btnAbertas.className = "btn-tab " + (aba === 'abertas' ? 'active-abertas' : '');
            
            renderizar();
        }

        function selecionarMesa(id) {
            var alvoSel = acharMesa(id);
            estado.mesaSelecionadaId = alvoSel ? alvoSel.id : id;
            if (CARDAPIO.length > 0 && !estado.produtoSelecionadoCache) {
                estado.produtoSelecionadoCache = CARDAPIO[0].nome;
            }
            estado.quantidadeCache = 1;
            renderizar();
        }

        function novaPessoa() {
            var nome = limparNome(prompt('Nome da pessoa:'));
            if (!nome) return;
            var existe = estado.pessoasNovas.some(function(n) { return n.toLowerCase() === nome.toLowerCase(); }) ||
                estado.pessoas.some(function(p) { return p.nome.toLowerCase() === nome.toLowerCase(); });
            if (!existe) estado.pessoasNovas.push(nome);
            processarPedidos();
            var alvo = estado.pessoas.find(function(p) { return p.nome.toLowerCase() === nome.toLowerCase(); });
            mudarAba('caixa');
            if (alvo) selecionarMesa(alvo.id);
        }
        function abrirNaCaixa(id) { mudarAba('caixa'); selecionarMesa(id); }

        function adicionarItem() {
            capturarValoresFormulario();
            if (!estado.mesaSelecionadaId) return;
            
            var prod = CARDAPIO.find(function(p) { return p.nome == estado.produtoSelecionadoCache; });
            if (!prod) {
                prod = CARDAPIO[0];
            }

            var qtd = Number(estado.quantidadeCache) || 1;
            var disponivel = estoqueDisponivel(prod.nome);
            if (disponivel <= 0) { alert(prod.nome + ' está esgotado.'); return; }
            if (qtd > disponivel) { alert('Estoque insuficiente de ' + prod.nome + ': restam ' + disponivel + '.'); return; }
            var mesaObj = acharMesa(estado.mesaSelecionadaId);
            if (!mesaObj) return;
            var idMesaFinal = chaveMesa(mesaObj);

            var novo = { 
                mesa: idMesaFinal, 
                produto: prod.nome, 
                qnt: qtd,
                preco: prod.preco,
                tipo: prod.tipo || 'bar',
                status: 'pendente',
                statusPreparo: 'pendente'
            };

            var base = estado.pedidosGlobais.filter(function(x) { return x.status !== 'fechado' && String(x.mesa) === String(novo.mesa) && x.produto === novo.produto; }).length;
            estado.pendentes.push({ pedido: novo, base: base, t: Date.now() });
            estado.pedidosGlobais.push(novo);

            // volta o formulário ao padrão: primeiro produto da lista e quantidade 1
            estado.produtoSelecionadoCache = primeiroDisponivel();
            estado.quantidadeCache = 1;
            var selForm = document.getElementById('select-produto');
            var qtdForm = document.getElementById('input-qtd');
            if (selForm) { selForm.selectedIndex = 0; if (estado.produtoSelecionadoCache) selForm.value = estado.produtoSelecionadoCache; }
            if (qtdForm) qtdForm.value = 1;

            processarPedidos();
            renderizar();

            var urlPedido = API_URL + '?acao=novo_pedido&mesa=' + encodeURIComponent(novo.mesa) +
                '&produto=' + encodeURIComponent(novo.produto) + '&qnt=' + encodeURIComponent(novo.qnt);
            fetch(urlPedido, { keepalive: true })
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    if (r && r.result === 'success') {
                        setTimeout(sincronizar, 500);
                    } else if (r && r.error) {
                        desfazerPedido(novo, r.error);
                    } else {
                        // Apps Script antigo (não conhece novo_pedido): envia pelo método antigo
                        fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                            keepalive: true, body: JSON.stringify(novo) })
                            .then(function() { setTimeout(sincronizar, 1000); });
                    }
                })
                .catch(function() { setTimeout(sincronizar, 1000); });
        }

        var clickTimers = {};
        function lidarComCliqueCard(idItem) {
            if (clickTimers[idItem]) {
                clearTimeout(clickTimers[idItem]);
                clickTimers[idItem] = null;
                mudarEstadoPorId(idItem, 'pronto');
            } else {
                clickTimers[idItem] = setTimeout(function() {
                    clickTimers[idItem] = null;
                    var p = estado.pedidosGlobais[idItem];
                    if (p && p.status !== 'fechado') {
                        var atual = p.statusPreparo || 'pendente';
                        mudarEstadoPorId(idItem, atual === 'pendente' ? 'preparando' : 'pendente');
                    }
                }, 250);
            }
        }

        function mudarEstadoPorId(idItem, novoEstado) {
            var p = estado.pedidosGlobais[idItem];
            if (p && p.status !== 'fechado') {
                p.statusPreparo = novoEstado;
                estado.overrides[chavePedido(estado.pedidosGlobais, idItem)] = { status: novoEstado, t: Date.now() };
                if (p.linha) {
                    fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ acao: 'status_preparo', linha: p.linha, produto: p.produto, statusPreparo: novoEstado }) });
                }
                processarPedidos();
                renderizar();
            }
        }

        var cancelando = false;
        function cancelarItem(idItem, qtdRemover) {
            if (cancelando) return;
            var p = estado.pedidosGlobais[idItem];
            if (!p || p.status === 'fechado') return;
            if (!p.linha) { alert('Esse pedido ainda está sendo gravado. Aguarde alguns segundos e tente de novo.'); return; }
            var q = Math.min(Number(qtdRemover) || 1, Number(p.qnt) || 1);
            var msg = q >= p.qnt
                ? 'Cancelar ' + p.qnt + 'x ' + p.produto + '?'
                : 'Remover ' + q + ' un de ' + p.produto + '? (ficam ' + (p.qnt - q) + ')';
            if (!confirm(msg + '\nO estoque será devolvido.')) return;
            cancelando = true;
            fetch(API_URL + '?acao=cancelar_item&linha=' + encodeURIComponent(p.linha) + '&mesa=' + encodeURIComponent(p.mesa) +
                  '&produto=' + encodeURIComponent(p.produto) + '&qnt=' + encodeURIComponent(q))
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    cancelando = false;
                    if (r && r.result === 'success') sincronizar();
                    else if (r && r.error) { alert(r.error); sincronizar(); }
                    else alert('Não foi possível cancelar. Confira se a versão nova do Codigo.gs está implantada.');
                })
                .catch(function() { cancelando = false; alert('Falha de conexão. Tente novamente.'); });
        }

        function encerrarTodas() {
            var abertas = todasMesas().filter(function(m) { return m.status === 'ocupada' && m.itens.length > 0; });
            if (abertas.length === 0) { alert('Não há mesas abertas.'); return; }
            if (!confirm('Encerrar ' + abertas.length + ' comanda(s) em aberto, total ' + brl(abertas.reduce(function(a, m) { return a + totalMesaObj(m); }, 0)) + '?')) return;
            var senha = prompt('Digite a senha para encerrar todas as mesas:');
            if (senha === null) return;
            fetch(API_URL + '?acao=encerrar_todas&senha=' + encodeURIComponent(senha))
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    if (r && r.result === 'success') {
                        estado.pessoasNovas = [];
                        estado.mesaSelecionadaId = null;
                        alert(r.mesas + ' comanda(s) encerrada(s). Valor que estava em aberto: ' + (r.totalTexto || ''));
                        sincronizar();
                    } else if (r && r.error) alert(r.error);
                    else alert('Não foi possível encerrar. Confira se a versão nova do Codigo.gs está implantada.');
                })
                .catch(function() { alert('Falha de conexão. Tente novamente.'); });
        }

        function fecharMesa(id) {
            var mesaObj = acharMesa(id);
            if (!mesaObj) return;
            var idAlvo = mesaObj.pessoa ? mesaObj.id : (mesaObj.idExibicao || id);
            if (!confirm("Fechar " + nomeMesa(mesaObj) + "?")) return;
            if (mesaObj.pessoa) {
                estado.pessoasNovas = estado.pessoasNovas.filter(function(n) { return n !== mesaObj.nome; });
            }

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ acao: 'fechar_mesa', mesa: idAlvo })
            }).then(function() {
                setTimeout(function() {
                    estado.mesaSelecionadaId = null;
                    sincronizar();
                }, 1000);
            });
        }

        function finalizarDia() {
            var mesasOcupadas = todasMesas().filter(function(m) { return m.status === 'ocupada' && m.itens.length > 0; });
            if (mesasOcupadas.length > 0) {
                alert("Não é possível finalizar o dia! Ainda existem mesas abertas.\nVá na aba 📋 Abertas e use \"Encerrar todas\" (senha) se for o caso.");
                return;
            }
            var senha = prompt("Digite a senha para finalizar o dia:");
            if (senha === null) return;

            fetch(API_URL + '?acao=finalizar_dia&senha=' + encodeURIComponent(senha))
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    if (r && r.result === 'success') {
                        estado.pendentes = [];
                        estado.overrides = {};
                        estado.pedidosGlobais = [];
                        estado.mesaSelecionadaId = null;
                        processarPedidos();
                        renderizar();
                        alert("Dia finalizado!\nTotal de vendas: " + (r.totalTexto || '') +
                            "\nBebidas: " + (r.bebidasTexto || '') + "\nComidas: " + (r.comidasTexto || '') +
                            "\nMesas que ficaram em aberto: " + (r.emAbertoTexto || '') + " (" + (r.nomesAbertas || 'nenhuma') + ")" +
                            "\n\nAs mesas voltaram ao início (Mesa 1, Mesa 2, ...).");
                        estado.pessoasNovas = [];
                        sincronizar();
                    } else {
                        if (r && r.error) alert(r.error);
                        else if (r && r.pedidos) alert("O Apps Script ainda está na versão antiga. Implante a nova versão do Codigo.gs (Implantar > Gerenciar implantações > Editar > Nova versão).");
                        else alert("Não foi possível finalizar o dia.");
                    }
                })
                .catch(function() {
                    alert("Falha de conexão. Verifique a internet e tente novamente.");
                });
        }

        function renderizar() {
            try {
                capturarValoresFormulario();
                var main = document.getElementById('app-conteudo');
                if (!main) return;

                if (estado.abaAtiva === 'caixa') {
                    var mesaSel = acharMesa(estado.mesaSelecionadaId);
                    var lateral = '';

                    if (mesaSel) {
                        var listaHtml = '';
                        var valorTotalComanda = 0;

                        if (mesaSel.itens.length === 0) {
                            listaHtml = '<p style="text-align: center; padding: 1rem;">Nenhum item lançado.</p>';
                        } else {
                            for (var j = 0; j < mesaSel.itens.length; j++) {
                                var item = mesaSel.itens[j];
                                var stPreparo = item.statusPreparo || 'pendente';
                                var subtotal = item.qnt * item.preco;
                                valorTotalComanda += subtotal;

                                var botoesCancel = (item.qnt > 1
                                    ? '<button onclick="event.stopPropagation(); cancelarItem(' + item.idItem + ', 1)" title="Remover 1 unidade" style="background:#fff; border:2px solid #000; padding:0.2rem 0.5rem; font-size:0.75rem;">−1</button>'
                                    : '') +
                                    '<button onclick="event.stopPropagation(); cancelarItem(' + item.idItem + ', ' + item.qnt + ')" title="Cancelar o item" style="background:#fff; border:2px solid #000; padding:0.2rem 0.5rem; font-size:0.75rem;">✕ Cancelar</button>';

                                listaHtml += '<div class="item-row">' +
                                    '<div><strong>' + item.qnt + 'x ' + esc(item.produto) + '</strong><br>' +
                                    '<small>Preço: ' + brl(item.preco) + ' | Subtotal: ' + brl(subtotal) + '</small><br>' +
                                    '<span class="badge" style="background:' + corStatus(stPreparo) + '; margin-top:2px; display:inline-block;">Status: ' + stPreparo.toUpperCase() + '</span></div>' +
                                    '<div style="display:flex; flex-direction:column; gap:0.25rem;">' + botoesCancel + '</div>' +
                                '</div>';
                            }
                        }

                        var opcoesHtml = '';
                        for (var c = 0; c < CARDAPIO.length; c++) {
                            var pItem = CARDAPIO[c];
                            var esgotado = estoqueDisponivel(pItem.nome) <= 0;
                            var selecionadoAttr = (pItem.nome === estado.produtoSelecionadoCache && !esgotado) ? 'selected' : '';
                            var disp = estoqueDisponivel(pItem.nome);
                            opcoesHtml += '<option value="' + esc(pItem.nome) + '" ' + selecionadoAttr + (esgotado ? ' disabled' : '') + '>' + esc(pItem.nome) + ' - ' + brl(pItem.preco) + (esgotado ? ' - ESGOTADO' : ' - ' + disp + ' un') + '</option>';
                        }


                        lateral = '<div class="painel-lateral">' +
                            '<div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #991b1b; padding-bottom: 0.75rem; margin-bottom: 1rem;">' +
                                '<h3>' + esc(nomeMesa(mesaSel)) + '</h3>' +
                                '<button data-id="' + esc(mesaSel.id) + '" onclick="fecharMesa(this.getAttribute(\'data-id\'))" style="background: #f87171; border: 2px solid #000; padding: 0.25rem 0.5rem; border-radius: 0.5rem;">Fechar Conta</button>' +
                            '</div>' +
                            '<div style="background: #facc15; border: 2px solid #000; padding: 0.5rem; border-radius: 0.5rem; margin-bottom: 1rem; text-align: center;">' +
                                '<strong style="font-size: 1rem;">Total Comanda: ' + brl(valorTotalComanda) + '</strong>' +
                            '</div>' +
                            '<div class="form-grupo">' +
                                '<label style="font-size: 0.75rem;">SELECIONAR PRODUTO</label>' +
                                '<select id="select-produto">' + opcoesHtml + '</select>' +
                                '<div style="margin-top: 0.5rem;"><label style="font-size:0.65rem;">Qtd Solicitada:</label><input type="number" id="input-qtd" value="' + estado.quantidadeCache + '" min="1" style="text-align: center;" oninput="estado.quantidadeCache = this.value"></div>' +
                                '<button onclick="adicionarItem()" class="btn-lancar" style="margin-top:0.5rem;">Lançar Pedido</button>' +
                            '</div>' +
                            '<div class="lista-itens">' + listaHtml + '</div>' +
                        '</div>';
                    } else {
                        lateral = '<div class="painel-lateral" style="justify-content: center; align-items: center; text-align: center;"><p>👆 Clique em uma mesa ao lado para gerenciar.</p></div>';
                    }

                    function cardHtml(m) {
                        var classeOcupada = m.status === 'ocupada' ? 'ocupada' : '';
                        var classeSelecionada = String(m.id) === String(estado.mesaSelecionadaId) ? 'selecionada' : '';
                        var textoStatus = m.status === 'ocupada'
                            ? (m.itens.length > 0 ? '<strong style="font-size: 1.1rem;">' + brl(totalMesaObj(m)) + '</strong><br>' + m.itens.length + ' itens' : 'Sem pedidos')
                            : 'Livre';
                        var corBar = '#fff', corCoz = '#fff';
                        if (m.status === 'ocupada') {
                            corBar = corGrupo(m.itens, false);
                            corCoz = corGrupo(m.itens, true);
                        }
                        return '<div class="mesa-card ' + classeOcupada + ' ' + classeSelecionada + '" data-id="' + esc(m.id) + '" onclick="selecionarMesa(this.getAttribute(\'data-id\'))">' +
                            '<div style="display: flex; justify-content: space-between; gap: 0.25rem;"><strong style="overflow-wrap:anywhere;">' + esc(nomeMesa(m)) + '</strong><span style="white-space: nowrap;">' + bolinha('bar', corBar) + bolinha('coz', corCoz) + '</span></div>' +
                            '<div><div style="font-size: 0.75rem;">' + textoStatus + '</div></div>' +
                        '</div>';
                    }
                    var mesasHtml = '';
                    for (var mIdx = 0; mIdx < estado.mesas.length; mIdx++) mesasHtml += cardHtml(estado.mesas[mIdx]);
                    var pessoasHtml = '';
                    for (var pIdx = 0; pIdx < estado.pessoas.length; pIdx++) pessoasHtml += cardHtml(estado.pessoas[pIdx]);

                    main.innerHTML = '<div class="grid-caixa">' +
                        '<div><h2 style="margin-bottom: 1rem; color:#000;">Selecione uma Mesa</h2><div class="mesas-grid">' + mesasHtml + '</div>' +
                        '<div style="display:flex; justify-content:space-between; align-items:center; margin: 1.5rem 0 1rem;"><h2 style="color:#000;">👤 Pessoas (em pé)</h2>' +
                        '<button onclick="novaPessoa()" style="background:#facc15; border:2px solid #000;">+ Nova Pessoa</button></div>' +
                        (pessoasHtml ? '<div class="mesas-grid">' + pessoasHtml + '</div>' : '<p style="color:#000; font-size:0.85rem;">Nenhuma pessoa em aberto. Use "+ Nova Pessoa" para lançar pedidos no nome de alguém.</p>') +
                        '</div>' +
                        lateral +
                    '</div>';
                } else if (estado.abaAtiva === 'abertas') {
                    var abertasLista = todasMesas().filter(function(m) { return m.status === 'ocupada' && m.itens.length > 0; });
                    var totalAbertas = abertasLista.reduce(function(a, m) { return a + totalMesaObj(m); }, 0);
                    var abHtml = '';
                    for (var ab = 0; ab < abertasLista.length; ab++) {
                        var ma = abertasLista[ab];
                        var linhasAb = '';
                        for (var li = 0; li < ma.itens.length; li++) {
                            var ia = ma.itens[li];
                            linhasAb += '<div style="display:flex; justify-content:space-between; gap:0.5rem; font-size:0.85rem;"><span>' + ia.qnt + 'x ' + esc(ia.produto) + '</span>' +
                                '<span class="badge" style="background:' + corStatus(ia.statusPreparo || 'pendente') + ';">' + String(ia.statusPreparo || 'pendente').toUpperCase() + '</span></div>';
                        }
                        abHtml += '<div class="mesa-card ocupada" style="height:auto; gap:0.5rem; cursor:default;">' +
                            '<div style="display:flex; justify-content:space-between;"><strong>' + esc(nomeMesa(ma)) + '</strong><strong>' + brl(totalMesaObj(ma)) + '</strong></div>' +
                            (ma.abertaEm ? '<small>Aberta em ' + esc(ma.abertaEm) + '</small>' : '') +
                            '<div style="display:flex; flex-direction:column; gap:0.25rem;">' + linhasAb + '</div>' +
                            '<button data-id="' + esc(ma.id) + '" onclick="abrirNaCaixa(this.getAttribute(\'data-id\'))" style="background:#fff; border:2px solid #000;">Abrir na caixa</button>' +
                        '</div>';
                    }
                    main.innerHTML = '<div>' +
                        '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem;">' +
                            '<h2 style="color:#000;">📋 Mesas abertas: ' + abertasLista.length + ' | ' + brl(totalAbertas) + '</h2>' +
                            '<button onclick="encerrarTodas()" style="background:#f87171; border:2px solid #000;"' + (abertasLista.length === 0 ? ' disabled' : '') + '>🔒 Encerrar todas (senha)</button>' +
                        '</div>' +
                        (abHtml ? '<div class="mesas-grid">' + abHtml + '</div>' : '<p style="color:#000; font-weight:bold; padding:2rem; text-align:center;">Nenhuma mesa em aberto.</p>') +
                    '</div>';
                } else {
                    var ehCozinha = (estado.abaAtiva === 'cozinha');
                    var itensKDS = [];

                    var mesasKDS = todasMesas();
                    for (var x = 0; x < mesasKDS.length; x++) {
                        var mesaObj = mesasKDS[x];
                        if (mesaObj.status === 'ocupada') {
                            for (var y = 0; y < mesaObj.itens.length; y++) {
                                var itemMesa = mesaObj.itens[y];
                                var tipoItem = (itemMesa.tipo || 'bar').toLowerCase();
                                var eCozinhaItem = tipoItem.includes('cozinha') || tipoItem.includes('petisco') || tipoItem.includes('comida');

                                if (itemMesa.statusPreparo !== 'entregue' && ((ehCozinha && eCozinhaItem) || (!ehCozinha && !eCozinhaItem))) {
                                    itensKDS.push({
                                        idItem: itemMesa.idItem,
                                        mesa: nomeMesa(mesaObj),
                                        produto: itemMesa.produto,
                                        qnt: itemMesa.qnt,
                                        statusPreparo: itemMesa.statusPreparo || 'pendente'
                                    });
                                }
                            }
                        }
                    }

                    var kdsHtml = '';
                    if (itensKDS.length === 0) {
                        kdsHtml = '<p style="grid-column: span 4; text-align: center; padding: 3rem; color:#000; font-weight:bold;">Nenhum item pendente no momento.</p>';
                    } else {
                        for (var z = 0; z < itensKDS.length; z++) {
                            var kItem = itensKDS[z];
                            var classePreparo = kItem.statusPreparo;
                            
                            kdsHtml += '<div class="kds-card ' + classePreparo + '" onclick="lidarComCliqueCard(' + kItem.idItem + ')">' +
                                '<div style="display: flex; justify-content: space-between;"><span class="badge">' + esc(kItem.mesa) + '</span><span style="font-size:0.75rem; font-weight:bold;">' + kItem.statusPreparo.toUpperCase() + '</span></div>' +
                                '<div style="font-size: 1.2rem; font-weight: bold;">' + kItem.qnt + 'x ' + esc(kItem.produto) + '</div>' +
                                '<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">' +
                                    '<span style="font-size: 0.65rem; font-weight: bold;">1 toque: preparando | 2 toques: pronto</span>' +
                                    '<button class="btn-acao-entregue" onclick="event.stopPropagation(); mudarEstadoPorId(' + kItem.idItem + ', \'entregue\')">Marcar Entregue</button>' +
                                '</div>' +
                            '</div>';
                        }
                    }

                    var tituloPainel = ehCozinha ? '🍳 Cozinha' : '🍻 Bar';
                    main.innerHTML = '<div><h2 style="margin-bottom: 1rem; color:#000;">' + tituloPainel + '</h2><div class="kds-grid">' + kdsHtml + '</div></div>';
                }
                var btnAb = document.getElementById('btn-aba-abertas');
                if (btnAb) {
                    var nAb = todasMesas().filter(function(m) { return m.status === 'ocupada' && m.itens.length > 0; }).length;
                    btnAb.textContent = '📋 Abertas' + (nAb > 0 ? ' (' + nAb + ')' : '');
                }
            } catch (err) {
                console.log("Erro crítico no renderizar:", err);
            }
        }

        // Executa imediatamente e sincroniza em segundo plano
        renderizar();
        sincronizar();
        setInterval(sincronizar, 5000);
    </script>
</body>
</html>
