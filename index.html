    <title>Lugar Comum Bar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        html, body { max-width: 100%; overflow-x: hidden; }
        body { background-color: #dc2626; color: #000; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #b91c1c; border-bottom: 2px solid #991b1b; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        h1 { font-size: 1.5rem; font-weight: bold; color: #facc15; }
        .nav-buttons { display: flex; flex-wrap: wrap; gap: 0.4rem; background: #b91c1c; padding: 0.25rem; border-radius: 0.75rem; border: 2px solid #7f1d1d; align-items: center; max-width: 100%; }
        @media(max-width: 480px) { .nav-buttons .btn-tab, .nav-buttons .btn-dia { font-size: 0.78rem; padding: 0.4rem 0.6rem; } }
        button { cursor: pointer; border: none; font-weight: bold; font-size: 0.875rem; border-radius: 0.5rem; padding: 0.5rem 1rem; color: #000; }
        .btn-tab { background: transparent; color: #1e1b4b; }
        .active-caixa { background: #facc15; color: #000; }
        .active-cozinha { background: #f97316; color: #000; }
        .active-bar { background: #38bdf8; color: #000; }
        .active-abertas { background: #c4b5fd; color: #000; }
        .active-vip { background: #fde68a; color: #000; }
        .active-logs { background: #e9d5ff; color: #000; }
        .btn-dia { background: #4ade80; border: 2px solid #000; }
        main { flex: 1; padding: 1.5rem; display: block; }
        .grid-caixa { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media(min-width: 1024px) { .grid-caixa { grid-template-columns: 2fr 1fr; } }
        .mesas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        @media(min-width: 640px) { .mesas-grid { grid-template-columns: repeat(4, 1fr); } }
        .grid-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1.25rem; }
        .mesa-card.cartao-aberto { height: auto; padding: 1.1rem 1.2rem; gap: 0.8rem; cursor: pointer; line-height: 1.35; }
        .mesa-card { background: #ef4444; border: 2px solid #b91c1c; border-radius: 0.75rem; padding: 1rem; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 8rem; color: #000; }
        .mesa-card.ocupada { border-color: #000; background: #fef08a; }
        .mesa-card.teste { background: #c4b5fd !important; border-color: #5b21b6 !important; }
        .kds-card.teste { border: 4px dashed #6d28d9; }
        .mesa-card.selecionada { border-color: #facc15 !important; border-width: 4px; box-shadow: 0 0 0 3px #facc15; }
        /* comanda aberta há mais de 12h: destaque suave de atenção (amarelo bem claro, puxado para o branco, com fonte em negrito) */
        .mesa-card.comanda-vencida { background: #fffbeb !important; border-color: #000 !important; }
        .mesa-card.comanda-vencida div, .mesa-card.comanda-vencida span, .mesa-card.comanda-vencida small, .mesa-card.comanda-vencida strong {
            font-weight: bold !important; color: #000 !important;
        }
        .mesa-card.comanda-vencida.selecionada { border-color: #facc15 !important; border-width: 4px; box-shadow: 0 0 0 3px #facc15; }
        .painel-lateral { background: #b91c1c; border: 2px solid #991b1b; border-radius: 1rem; padding: 1.25rem; display: flex; flex-direction: column; color: #000; }
        .form-grupo { background: #ef4444; padding: 0.75rem; border-radius: 0.75rem; border: 2px solid #b91c1c; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        select, input { background: #fff; border: 2px solid #000; border-radius: 0.5rem; padding: 0.5rem; font-size: 0.875rem; width: 100%; font-weight: bold; color: #000; }
        .btn-lancar { background: #facc15; font-weight: bold; width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 2px solid #000; color: #000; }
        .lista-itens { flex: 1; overflow-y: auto; max-height: 14rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .item-row { background: #ef4444; padding: 0.75rem; border-radius: 0.5rem; border: 2px solid #b91c1c; display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; color: #000; }
        .kds-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 1rem; }
        @media(min-width: 768px) { .kds-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 1024px) { .kds-grid { grid-template-columns: repeat(4, 1fr); } }

        /* página Relatórios: celular empilha tudo (kpis, depois os fechamentos, depois produtos);
           tablet já separa kpis de um lado e fechamentos de outro; computador abre as 3 colunas
           (kpis | fechamentos | produtos mais vendidos), igual o layout pedido. */
        .rel-layout { display: grid; grid-template-columns: 1fr; gap: 0.7rem; align-items: start; }
        .rel-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
        @media(min-width: 768px) { .rel-layout { grid-template-columns: 10rem 1fr; } .rel-kpis { grid-template-columns: 1fr; } .rel-produtos { grid-column: 1 / -1; } }
        @media(min-width: 1150px) { .rel-layout { grid-template-columns: 10rem 1fr 15rem; } .rel-produtos { grid-column: auto; } }

        /* painel principal de Relatórios por período (Hoje/Ontem/7 dias/30 dias/Este mês/Escolher datas): cards pequenos
           em cima (faturamento, ticket médio etc.), cards maiores embaixo (forma de pagamento, por dia, itens, cancelados). */
        .rel-periodo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
        .rel-periodo-grid2 { display: grid; grid-template-columns: 1fr; gap: 0.6rem; margin-top: 0.6rem; }
        @media(min-width: 640px) { .rel-periodo-grid { grid-template-columns: repeat(3, 1fr); } }
        @media(min-width: 900px) { .rel-periodo-grid { grid-template-columns: repeat(4, 1fr); } .rel-periodo-grid2 { grid-template-columns: 1fr 1fr; } }

        .kds-card { padding: 1rem; border-radius: 0.75rem; border: 2px solid #991b1b; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 12rem; gap: 0.5rem; background: #f472b6; color: #000; }
        .kds-card.preparando { background: #f97316; }
        .kds-card.pronto { background: #4ade80; }
        .kds-card.entregue { background: #facc15; }
        /* pisca até ser atendido (cozinha/bar: pedido novo) ou entregue (caixa/abertas: item pronto esperando) */
        @keyframes piscar { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); opacity: 1; } 50% { box-shadow: 0 0 0 5px #fff, 0 0 16px 6px #facc15; opacity: 0.72; } }
        .piscando { animation: piscar 1s ease-in-out infinite; -webkit-animation: piscar 1s ease-in-out infinite; }

        .badge { padding: 0.125rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold; background: #fff; color: #000; }
        .btn-acao-entregue { background: #fff; border: 2px solid #000; border-radius: 0.4rem; padding: 0.3rem 0.5rem; font-size: 0.75rem; font-weight: bold; color: #000; text-align: center; }
.bloqueado header, .bloqueado main { visibility: hidden !important; }
        .sync-status.off { background: #ff0000 !important; color: #fff !important; border-color: #fff; animation: piscaOff 1s infinite; }
        @keyframes piscaOff { 50% { opacity: 0.55; } }
        .sync-status { font-size: 0.75rem; font-weight: bold; background: #4ade80; padding: 0.25rem 0.5rem; border-radius: 0.25rem; border: 1px solid #000; color: #000; }
            /* Safari antigo (iPad com iOS 12) não conhece "gap" em flexbox: espaçamento reserva */
        .sem-gap header > *, .sem-gap .nav-buttons > *, .sem-gap [style*="display:flex"] > *, .sem-gap [style*="display: flex"] > * { margin-right: 0.4rem; margin-bottom: 0.3rem; }
        .sem-gap .form-grupo > *, .sem-gap .lista-itens > *, .sem-gap .kds-card > *, .sem-gap [style*="flex-direction:column"] > * { margin-right: 0; margin-bottom: 0.4rem; }
        html { -webkit-text-size-adjust: 100%; }
        body { padding-top: env(safe-area-inset-top); }
        /* modo SUPREME: tema roxo (as cores de status e de produto continuam iguais) */
        body.supreme { background-color: #7c3aed; }
        body.supreme header { background-color: #5b21b6; border-bottom-color: #3b0764; }
        body.supreme .nav-buttons { background: #5b21b6; border-color: #3b0764; }
        body.supreme .btn-tab { color: #fff; }
        body.supreme .btn-tab[class*="active-"] { color: #000; }
        body.supreme .painel-lateral { background: #a855f7; border-color: #6b21a8; }
        body.supreme .mesa-card, body.supreme .form-grupo, body.supreme .item-row { background: #c084fc; border-color: #6b21a8; }
        body.supreme .mesa-card.ocupada { background: #fef08a; border-color: #000; }
        body.supreme .mesa-card.teste { background: #e9d5ff !important; border-color: #3b0764 !important; }
        body.supreme .kds-card { border-color: #6b21a8; }
        body.supreme [style*="background:#b91c1c"] { background: #a855f7 !important; }
        body.supreme [style*="background:#ef4444"] { background: #c084fc !important; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1><span id="icone-foice">☭</span> Lugar Comum Bar</h1>
        </div>
        <div class="nav-buttons">
            <button id="btn-aba-caixa" class="btn-tab active-caixa" onclick="mudarAba('caixa')">🧮 Caixa / Comandas</button>
            <button id="btn-aba-cozinha" class="btn-tab" onclick="mudarAba('cozinha')">🍳 Cozinha</button>
            <button id="btn-aba-bar" class="btn-tab" onclick="mudarAba('bar')">🍻 Bar</button>
            <button id="btn-aba-abertas" class="btn-tab" onclick="mudarAba('abertas')">📋 Abertas</button>
            <button id="btn-aba-vip" class="btn-tab" onclick="mudarAba('vip')">⭐ VIPs</button>
            <button id="btn-aba-finalizadas" class="btn-tab" onclick="mudarAba('finalizadas')">✅ Finalizadas</button>
            <button id="btn-aba-relatorios" class="btn-tab" style="display:none;" onclick="mudarAba('relatorios')">📊 Relatórios</button>
            <button id="btn-aba-logs" class="btn-tab" style="display:none;" onclick="mudarAba('logs')">🛡️ Logs</button>
            <button class="btn-dia" id="btn-dia" onclick="finalizarDia()">🏁 Finalizar Dia</button>
            <span id="info-usuario" class="sync-status" style="background:#fff;"></span>
            <button class="btn-tab" id="btn-som" onclick="alternarSom()" title="Ligar/desligar os avisos sonoros">🔔 Som</button>
            <button class="btn-tab" onclick="sair()" title="Sair deste aparelho">Sair</button>
        </div>
    </header>
    <div style="display:flex; justify-content:flex-end; padding:0.35rem 1rem 0;"><span id="sync-indicator" class="sync-status">Conectado</span></div>

    <main id="app-conteudo"></main>

    <script>
        (function() {
            try {
                var a = document.createElement('div'); a.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
                a.appendChild(document.createElement('i')); a.appendChild(document.createElement('i'));
                a.firstChild.style.height = a.lastChild.style.height = '1px';
                document.body.appendChild(a);
                var ok = a.offsetHeight === 3;
                document.body.removeChild(a);
                if (!ok) document.documentElement.className += ' sem-gap';
            } catch (e) {}
        })();
        var ESTACAO = /[?&]estacao=1/.test(location.search); // notebook do bar: imprime sozinho o que os iPads enviam
        var API_URL = "https://script.google.com/macros/s/AKfycbyawZahFXeytjgTj2-yId6TIQwF7RoSqF2alHUj4AF46Huhmsl4keW4bUm6sakf8p_M/exec";

        // ---------- login da equipe (usuário + senha da aba "Key" da planilha) ----------
        // Todas as chamadas ao servidor levam usuário e senha; sem eles o servidor não responde.
        // O login fica guardado neste aparelho até o fim do dia de trabalho (06:00) e sobrevive a atualizações da página.
        function diaDeTrabalho() { return new Date(Date.now() - 6 * 3600 * 1000).toDateString(); }
        function lerSessao() {
            try {
                var v = JSON.parse(localStorage.getItem('lcb_sessao2') || 'null');
                return (v && v.dia === diaDeTrabalho() && v.chave && v.usuario) ? v : null;
            } catch (e) { return null; }
        }
        function guardarSessao(usuario, chave) {
            try { if (chave) localStorage.setItem('lcb_sessao2', JSON.stringify({ usuario: usuario, chave: chave, dia: diaDeTrabalho() })); else localStorage.removeItem('lcb_sessao2'); } catch (e) {}
        }
        var SESSAO = lerSessao();
        var CHAVE = SESSAO ? SESSAO.chave : '';
        var USUARIO = SESSAO ? SESSAO.usuario : '';
        var DEV = (function() {
            try {
                var d = localStorage.getItem('lcb_dev');
                if (!d) { d = Math.random().toString(36).substring(2, 6); localStorage.setItem('lcb_dev', d); }
                var ua = navigator.userAgent || '', plat = /iPad/.test(ua) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Aparelho';
                return plat + ' ' + d;
            } catch (e) { return 'Aparelho'; }
        })();
        var fetchOriginal = fetch;
        fetch = function(u, o) {
            if (String(u).indexOf(API_URL) !== 0) return fetchOriginal(u, o);
            if (CHAVE && !lerSessao()) { CHAVE = ''; USUARIO = ''; } // virou o dia de trabalho
            if (!CHAVE) { pedirChave(''); return Promise.reject(new Error('sem login')); }
            if (o && o.method === 'POST') {
                var corpo = {};
                try { corpo = JSON.parse(o.body); } catch (e) {}
                corpo.chave = CHAVE; corpo.usuario = USUARIO; corpo.dev = DEV;
                var o2 = {}; for (var k in o) o2[k] = o[k];
                o2.body = JSON.stringify(corpo);
                return fetchOriginal(u, o2);
            }
            u = String(u) + (String(u).indexOf('?') >= 0 ? '&' : '?') + 'chave=' + encodeURIComponent(CHAVE) + '&usuario=' + encodeURIComponent(USUARIO) + '&dev=' + encodeURIComponent(DEV);
            return fetchOriginal(u, o).then(function(res) {
                return res.clone().json().then(function(j) {
                    if (j && j.negado) {
                        CHAVE = ''; USUARIO = ''; guardarSessao('', '');
                        estado.usuario = null; // a sessão caiu (senha errada, bloqueio, off ou desligado): nunca deixa o sistema aberto sem login válido
                        try { atualizarUsuario(); } catch (eAU) {}
                        pedirChave(j.off ? 'Seu acesso está desativado (off).' : ((j.bloqueado || j.desbloqueado) ? j.error : 'Usuário ou senha incorretos.'));
                    }
                    return res;
                }).catch(function() { return res; });
            });
        };
        function pedirChave(aviso) {
            var existente = document.getElementById('janela-chave');
            if (existente) {
                if (!aviso) return; // já está mostrando a tela de login (sem erro novo pra avisar): não mexe, evita piscar/perder o foco
                existente.parentNode.removeChild(existente); // tem um aviso novo (ex.: senha errada): refaz a tela com a mensagem certa
            }
            var el = document.createElement('div');
            el.id = 'janela-chave';
            el.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%; background:#b82013; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; padding:1rem;';
            el.innerHTML = '<div style="position:absolute; right:16px; bottom:12px; text-align:right; pointer-events:none; font-family:\'Helvetica Neue\',Arial,sans-serif; font-weight:800; text-transform:uppercase; color:#f1c73d; font-size:2.4rem; line-height:1.2; letter-spacing:2px;">Lugar Comum<br>Bar</div>' +
                '<div style="background:#fff; border:3px solid #000; border-radius:0.75rem; padding:1.25rem; width:100%; max-width:22rem; color:#000;">' +
                '<h3 style="margin-bottom:0.75rem;">🔒 Entrar no sistema</h3>' +
                (aviso ? '<p style="color:#b91c1c; font-weight:bold; margin-bottom:0.5rem;">' + esc(aviso) + '</p>' : '') +
                '<label style="font-size:0.85rem;">Usuário:</label>' +
                '<input type="text" id="input-usuario" autocomplete="username" style="width:100%; margin:0.25rem 0 0.5rem;">' +
                '<label style="font-size:0.85rem;">Senha:</label>' +
                '<input type="password" id="input-chave" autocomplete="current-password" style="width:100%; margin:0.25rem 0 0.4rem;" onkeydown="if(event.key===\'Enter\') entrarComChave()">' +
                '<label style="display:block; font-size:0.85rem; margin-bottom:0.75rem;"><input type="checkbox" id="chk-ver-senha" style="width:auto; display:inline-block; margin-right:0.4rem;" onchange="document.getElementById(\'input-chave\').type = this.checked ? \'text\' : \'password\'"> Mostrar senha</label>' +
                '<button type="button" onclick="entrarComChave()" style="background:#facc15; border:2px solid #000; width:100%;">Entrar</button></div>';
            document.body.appendChild(el);
            document.body.classList.add('bloqueado');
            var inp = document.getElementById('input-usuario');
            if (inp && inp.focus) inp.focus();
        }
        function entrarComChave() {
            var u = String((document.getElementById('input-usuario') || {}).value || '').trim();
            var v = String((document.getElementById('input-chave') || {}).value || '').trim();
            if (!u || !v) return;
            var btn = document.querySelector('#janela-chave button');
            if (btn) { btn.disabled = true; btn.textContent = 'Verificando...'; }
            CHAVE = v; USUARIO = u;
            guardarSessao(u, v); // precisa gravar já (senão o próprio fetch acha que "virou o dia" e cancela o pedido antes de mandar)
            // só sai da tela de login e mostra o sistema DEPOIS que o servidor confirmar a senha — nunca antes
            sincronizar().then(function() {
                if (estado.usuario) {
                    var el = document.getElementById('janela-chave');
                    if (el && el.parentNode) el.parentNode.removeChild(el);
                    document.body.classList.remove('bloqueado');
                    return;
                }
                // senha errada/bloqueado/off/desligado: o próprio fetch já trocou a tela de login pelo aviso certo.
                // Se foi só falha de rede (sem resposta), a tela continua igual: só libera o botão de novo.
                var btn2 = document.querySelector('#janela-chave button');
                if (btn2) { btn2.disabled = false; btn2.textContent = 'Entrar'; }
            });
        }
        function sair() {
            if (!confirm('Sair do sistema neste aparelho?')) return;
            CHAVE = ''; USUARIO = ''; guardarSessao('', '');
            estado.usuario = null;
            atualizarUsuario();
            pedirChave('');
        }
        function ehCont() { return !!(estado.usuario && estado.usuario.cont); } // papel "cont": só visualiza Abertas/VIP/Finalizadas, fecha comandas, finaliza o dia e usa Relatórios por completo
        function atualizarUsuario() {
            var el = document.getElementById('info-usuario');
            if (!el) return;
            try { document.body.className = document.body.className.replace(/\s*\bsupreme\b/g, '') + (estado.usuario && estado.usuario.supreme ? ' supreme' : ''); } catch (eS) {}
            var bl = document.getElementById('btn-aba-logs');
            if (bl) bl.style.display = (estado.usuario && estado.usuario.supreme) ? '' : 'none';
            if (estado.abaAtiva === 'logs' && !(estado.usuario && estado.usuario.supreme)) { estado.abaAtiva = 'caixa'; try { mudarAba('caixa'); } catch (eL) {} }
            var brl2 = document.getElementById('btn-aba-relatorios');
            if (brl2) brl2.style.display = (estado.usuario && (estado.usuario.admin || ehCont())) ? '' : 'none'; // admin, supreme e cont veem Relatórios
            if (estado.abaAtiva === 'relatorios' && !(estado.usuario && (estado.usuario.admin || ehCont()))) { estado.abaAtiva = 'caixa'; try { mudarAba('caixa'); } catch (eR0) {} }
            var bd = document.getElementById('btn-dia');
            if (bd) bd.style.display = (estado.usuario && !estado.usuario.admin && !ehCont()) ? 'none' : ''; // user não vê Finalizar Dia; admin e cont veem
            // papel "cont": só lança/edita pedido em lugar nenhum, então some com Caixa/Cozinha/Bar e já abre direto em "Abertas"
            ['btn-aba-caixa', 'btn-aba-cozinha', 'btn-aba-bar'].forEach(function(id) {
                var b = document.getElementById(id);
                if (b) b.style.display = ehCont() ? 'none' : '';
            });
            if (ehCont() && (estado.abaAtiva === 'caixa' || estado.abaAtiva === 'cozinha' || estado.abaAtiva === 'bar')) {
                estado.abaAtiva = 'abertas'; try { mudarAba('abertas'); } catch (eC0) {}
            }
            el.textContent = estado.usuario ? ('👤 ' + estado.usuario.nome + (estado.usuario.supreme ? ' (supreme)' : estado.usuario.admin ? ' (admin)' : ehCont() ? ' (cont)' : ' (user)')) : '';
            atualizarRotuloVersao();
            rotuloSom();
        }
        function exigirAdmin() {
            if (estado.usuario && !estado.usuario.admin) { alert('Somente administradores podem fazer isso.'); return false; }
            return true;
        }
        function exigirAdminOuCont() { // finalizar o dia também é permitido para o papel "cont"
            if (estado.usuario && !estado.usuario.admin && !ehCont()) { alert('Somente administradores podem fazer isso.'); return false; }
            return true;
        }

        // Cardápio de segurança preenchido para garantir funcionamento imediato
        var CARDAPIO = [
            { nome: "Refrigerante", preco: 6.00, estoque: 50, tipo: "bar" },
            { nome: "Kariri", preco: 10.00, estoque: 30, tipo: "bar" },
            { nome: "Conserva", preco: 15.00, estoque: 20, tipo: "cozinha" }
        ];
        // última lista de produtos recebida da planilha fica guardada neste aparelho: abre instantâneo, sem esperar a planilha
        var CARDAPIO_OK = false;
        try {
            var cacheCard = JSON.parse(localStorage.getItem('cardapioCache') || 'null');
            if (cacheCard && cacheCard.length) { CARDAPIO = cacheCard; CARDAPIO_OK = true; }
        } catch (eC) {}

        var estado = {
            abaAtiva: 'caixa',
            mesaSelecionadaId: null,
            produtoSelecionadoCache: '',
            quantidadeCache: 1,
            pedidosGlobais: [],
            pendentes: [],
            overrides: {},
            obsCache: '',
            mesas: [],
            pessoas: [],
            pessoasNovas: [],
            finalizadas: [],
            frequentes: [],
            clientes: [],
            telefones: [],
            usuario: null,
            fechamento: null
        };
        var PREFIXO_PESSOA = 'Pessoa: ';

        estado.mesasNovas = []; // números de comanda digitados em "+ Nova comanda" que ainda não receberam pedido

        var CORES_STATUS = { pendente: '#f472b6', preparando: '#f97316', pronto: '#4ade80', entregue: '#facc15' };
        function corStatus(st) { return CORES_STATUS[st] || '#fff'; }

        // chave estável de um item aberto: mesa + produto + ordem entre os itens abertos iguais.
        // Não usa o horário: um pedido recém-lançado (ainda sem horário) e o mesmo pedido depois de gravado na planilha têm a mesma chave.
        function chavePedido(lista, idx) {
            var q0 = lista[idx];
            if (q0.status === 'fechado') return 'fechado|' + idx;
            var base = String(q0.mesa) + '|' + q0.produto;
            var n = 0;
            for (var i = 0; i < idx; i++) {
                var q = lista[i];
                if (q.status !== 'fechado' && String(q.mesa) + '|' + q.produto === base) n++;
            }
            return base + '|' + n;
        }

        function esc(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function brl(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        // observação do pedido (ex.: sem cebola): texto curto, sem quebra de linha
        function limparObs(v) {
            return String(v === undefined || v === null ? '' : v).replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').replace(/^[=+\-@\s]+/, '').trim().substring(0, 60);
        }
        function htmlObs(obs, grande) {
            if (!obs) return '';
            return grande
                ? '<div style="font-size:0.9rem; font-weight:bold; background:#fff; border:2px solid #000; border-radius:0.4rem; padding:0.15rem 0.4rem; margin-top:0.25rem;">📝 ' + esc(obs) + '</div>'
                : '<br><small>📝 ' + esc(obs) + '</small>';
        }
        function ehVip(chave) { return String(chave).indexOf('VIP-') === 0; }
        function ehPessoa(chave) { return String(chave).indexOf(PREFIXO_PESSOA) === 0; }
        function limparNome(n) {
            return String(n || '').replace(/[.|<>&"'`=+@\\]/g, ' ').replace(/\s+/g, ' ').trim().substring(0, 30);
        }
        // "Comanda 003 - Fernando - 11999998888" -> {num:'003', nome:'Fernando', tel:'11999998888'}
        function partesPessoa(n) {
            var m = /^Comanda (T?\d+) - (.*)$/.exec(String(n));
            if (!m) return { num: '', nome: String(n), tel: '' };
            var resto = m[2], t = /^(.*) - (\d{8,})$/.exec(resto);
            return t ? { num: m[1], nome: t[1], tel: t[2] } : { num: m[1], nome: resto, tel: '' };
        }
        // campo de telefone (opcional) antes do 1º pedido: 'pessoa' (grava na chave), 'mesa' (grava na aba Telefones) ou ''
        // nome (só mesas): sugere clientes da aba Clientes e, se o cliente tem telefone lá, preenche o campo
        // clientes com o MESMO nome completo (ex.: 4 "Fernando"): a lista mostra o final do telefone para diferenciar
        function sufixoTel(c) { return ''; } // (não mostramos mais o final do telefone: o bar não decora os números)
        // nome sem sobrenome que já existe na lista: sugere sobrenome ou apelido para não confundir clientes
        function avisoNomeRepetido(txt) {
            var t = limparNome(txt), q = semAcento(t);
            if (!q || q.indexOf(' ') >= 0) return '';
            var existe = estado.clientes.some(function(c) { return semAcento(c.nome) === q; });
            return existe ? '<div style="background:#fef3c7; border:2px solid #b45309; border-radius:0.5rem; padding:0.4rem 0.5rem; margin-top:0.4rem; font-size:0.8rem; color:#000;">⚠️ Já existe um cliente chamado <b>' + esc(t) + '</b>. Se for outra pessoa, acrescente o <b>sobrenome ou apelido</b> (ex.: ' + esc(t) + ' Silva, ' + esc(t) + ' Barba).</div>' : '';
        }
        function achaCliente(nome) {
            var q = semAcento(limparNome(nome));
            if (!q) return null;
            return estado.clientes.find(function(c) { return semAcento(c.nome) === q; }) || null;
        }
        function preencherTelDoCliente(c) {
            var t = document.getElementById('input-tel-pessoa'), ni = document.getElementById('tel-ni');
            if (!c || !c.tel || !t) return;
            estado.telNI = false; if (ni) ni.checked = false;
            t.disabled = false; t.value = c.tel; estado.telCache = c.tel;
        }
        function sugerirNomeMesa(txt) {
            estado.nomeMesaCache = txt;
            var box = document.getElementById('sug-mesa');
            if (!box) return;
            var lista = limparNome(txt) ? filtrarClientes(txt) : [];
            box.innerHTML = lista.length ? '<div style="border:2px solid #000; border-radius:0.5rem; overflow:hidden; margin-top:0.25rem;">' + lista.map(function(c) {
                return '<button type="button" data-nome="' + esc(c.nome) + '" data-tel="' + esc(c.tel || '') + '" onclick="escolherNomeMesa(this.getAttribute(\'data-nome\'), this.getAttribute(\'data-tel\'))" style="display:block; width:100%; text-align:left; background:#fff; border:0; border-bottom:1px solid #ccc; padding:0.5rem; color:#000;">' + esc(c.nome) + (c.tel ? sufixoTel(c) + ' 📞' : '') + '</button>';
            }).join('') + '</div>' : '';
            box.innerHTML += avisoNomeRepetido(txt);
            var ex = achaCliente(txt);
            if (ex && ex.tel && !String(estado.telCache || '').trim()) preencherTelDoCliente(ex);
        }
        function escolherNomeMesa(nome, tel) {
            var inp = document.getElementById('input-nome-mesa');
            if (inp) inp.value = nome;
            estado.nomeMesaCache = nome;
            var box = document.getElementById('sug-mesa'); if (box) box.innerHTML = '';
            if (tel) preencherTelDoCliente({ tel: tel }); else preencherTelDoCliente(achaCliente(nome));
        }
        function telNaoInformado(on) {
            estado.telNI = !!on;
            var t = document.getElementById('input-tel-pessoa');
            if (t) { if (on) { t.value = ''; estado.telCache = ''; } t.disabled = !!on; }
        }
        function tipoCampoTelefone(m) {
            if (!m || m.vip || (m.itens && m.itens.length)) return '';
            if (m.pessoa) { var pp = partesPessoa(m.nome); return (pp.num && !pp.tel) ? 'pessoa' : ''; }
            return 'mesa';
        }
        function todasMesas() { return estado.mesas.concat(estado.pessoas); }
        // ordenação por atividade recente: comanda nova (sem pedido ainda) fica no topo;
        // entre as que já têm pedido, quem recebeu o pedido mais recente (maior linha na planilha) fica mais acima
        function chaveRecencia(m) {
            if (!m || !m.itens || !m.itens.length) return Infinity;
            var mx = -1;
            for (var i = 0; i < m.itens.length; i++) {
                var l = Number(m.itens[i].linha);
                if (!isNaN(l) && l > mx) mx = l;
            }
            return mx < 0 ? Infinity : mx;
        }
        // cópia dos itens da comanda ordenada do mais novo pro mais antigo, só para exibição na tela (não mexe na ordem usada no recibo/fechamento)
        function itensOrdenados(m) {
            if (!m || !m.itens) return [];
            return m.itens.slice().sort(function(a, b) {
                var la = Number(a.linha), lb = Number(b.linha);
                if (isNaN(la)) la = -1;
                if (isNaN(lb)) lb = -1;
                return lb - la;
            });
        }
        function acharMesa(id) { return todasMesas().find(function(m) { return String(m.id) === String(id); }); }
        // nome para mostrar na tela
        function nomeMesa(m) {
            if (m.pessoa) {
                var pp = partesPessoa(m.nome);
                if (!m.vip && pp.num) return '👤 ' + pp.nome + ' · Comanda ' + pp.num;
                return (m.vip ? '⭐ ' : '👤 ') + m.nome;
            }
            var r = padKey(m.idExibicao || m.id);
            if (m.status === 'livre' && m.contadorFehamentos > 0) r = padKey(m.id) + '.' + m.contadorFehamentos;
            return 'Comanda ' + r;
        }
        // identificador gravado na coluna A da planilha para novos pedidos
        function chaveMesa(m) {
            if (m.pessoa) return m.id;
            if (m.status === 'livre' && m.contadorFehamentos > 0) return padKey(m.id) + '.' + m.contadorFehamentos;
            if (m.status === 'ocupada' && m.idExibicao) return m.idExibicao;
            return padKey(m.id);
        }
        function totalMesaObj(m) {
            var t = 0;
            for (var i = 0; i < m.itens.length; i++) t += m.itens[i].qnt * m.itens[i].preco;
            return t;
        }

        // ---- modo TESTE (login Queen): pedidos marcados com [TESTE] na observação, mostrados em roxo com a etiqueta TESTE ----
        function souTeste() { return !!(estado.usuario && estado.usuario.supreme); } // papel supreme (coluna C da aba Key)
        // Comanda 000 com o nome Teste é a comanda de teste liberada para QUALQUER usuário (nunca entra no caixa nem mexe no estoque)
        function ehMesaTesteFixa(m) { return /Comanda\s*0{1,3}\s*-\s*Teste\b/i.test(String(m || '')); }
        function etiquetaTeste() { return '<b style="background:#6d28d9; color:#fff; border-radius:0.3rem; padding:0 0.4rem; font-size:0.75rem; letter-spacing:0.05em;">TESTE</b>'; }
        function mesaTeste(m) { return !!(m && m.itens && m.itens.some(function(it) { return it.teste; })); }
        // comanda aberta há mais de 12h: entra em destaque de atenção no cartão
        function comandaVencida(m) {
            if (!m || !m.abertaEm) return false;
            var d = String(m.abertaEm).match(/(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})/);
            if (!d) return false;
            var inicio = new Date(Number(d[3]), Number(d[2]) - 1, Number(d[1]), Number(d[4]), Number(d[5]), Number(d[6])).getTime();
            if (!inicio || isNaN(inicio)) return false;
            return (Date.now() - inicio) > 12 * 60 * 60 * 1000;
        }
        // cores da lista de produtos: caixa = verde suave, bar = azul suave, cozinha = vermelho suave (+ coração no texto, p/ iPad que ignora a cor)
        function estiloTipo(tipo) {
            var t = String(tipo || 'bar').toLowerCase();
            if (t.indexOf('caixa') >= 0) return { bg: '#dcfce7', ico: '💚 ' };
            if (t.indexOf('cozinha') >= 0 || t.indexOf('petisco') >= 0 || t.indexOf('comida') >= 0) return { bg: '#fee2e2', ico: '❤️ ' };
            return { bg: '#dbeafe', ico: '💙 ' };
        }
        function itemEhCaixa(it) { return String(it.tipo || '').toLowerCase().indexOf('caixa') >= 0; }
        function itemEhCozinha(it) {
            var t = String(it.tipo || 'bar').toLowerCase();
            return t.indexOf('cozinha') >= 0 || t.indexOf('petisco') >= 0 || t.indexOf('comida') >= 0;
        }
        // cor do grupo (bar ou cozinha) da mesa: pronto > preparando > pendente > entregue; branco = sem itens
        function corGrupo(itens, cozinha) {
            var sts = itens.filter(function(it) { return !itemEhCaixa(it) && itemEhCozinha(it) === cozinha; })
                           .map(function(it) { return it.statusPreparo || 'pendente'; });
            if (sts.length === 0) return '#fff';
            return corStatus(sts.indexOf('pronto') >= 0 ? 'pronto' : sts.indexOf('preparando') >= 0 ? 'preparando' : sts.indexOf('pendente') >= 0 ? 'pendente' : 'entregue');
        }
        function bolinha(rotulo, cor) {
            return '<span style="background:' + cor + '; border: 2px solid #000; border-radius: 999px; padding: 0 0.4rem; font-size: 0.65rem; font-weight: bold; color: #000; display: inline-block; line-height: 1.1rem; margin-left: 0.25rem;">' + rotulo + '</span>';
        }

        // estoque disponível = estoque da planilha - pedidos enviados que o servidor ainda não gravou
        function estoqueDisponivel(nome) {
            var p = CARDAPIO.find(function(x) { return x.nome === nome; });
            if (!p) return 0;
            var reservado = 0;
            estado.pendentes.forEach(function(pd) {
                if (pd.pedido.produto === nome && !pd.pedido.teste) reservado += Number(pd.pedido.qnt) || 0; // teste não reserva estoque
            });
            return (Number(p.estoque) || 0) - reservado;
        }
        function primeiroDisponivel() {
            for (var c = 0; c < CARDAPIO.length; c++) {
                if (estoqueDisponivel(CARDAPIO[c].nome) > 0) return CARDAPIO[c].nome;
            }
            return '';
        }
        function desfazerPedido(novo, mensagem) {
            estado.pendentes = estado.pendentes.filter(function(pd) { return pd.pedido !== novo; });
            estado.pedidosGlobais = estado.pedidosGlobais.filter(function(x) { return x !== novo; });
            processarPedidos();
            renderizar();
            alert(mensagem);
            sincronizar();
        }

        function processarPedidos() {
            try {
                // comandas (mesas) existem só enquanto abertas: as que têm pedidos + as recém-criadas
                var idsMesa = {};
                estado.mesasNovas.forEach(function(n) { idsMesa[String(n)] = true; });
                for (var q = 0; q < estado.pedidosGlobais.length; q++) {
                    var pq = estado.pedidosGlobais[q];
                    if (!pq || !pq.mesa || ehPessoa(pq.mesa) || ehVip(pq.mesa)) continue;
                    var bq = String(pq.mesa).split('.')[0];
                    if (/^\d+$/.test(bq)) idsMesa[String(parseInt(bq, 10))] = true;
                }
                var antigas = estado.mesas;
                estado.mesas = Object.keys(idsMesa).map(function(id) {
                    var ex = antigas.find(function(m) { return String(m.id) === id; });
                    return ex || { id: parseInt(id, 10), status: 'livre', itens: [], contadorFehamentos: 0 };
                }).sort(function(a, b) { return a.id - b.id; });
                for (var i = 0; i < estado.mesas.length; i++) {
                    estado.mesas[i].itens = [];
                    estado.mesas[i].status = 'livre';
                    estado.mesas[i].contadorFehamentos = 0;
                    estado.mesas[i].idExibicao = null;
                    estado.mesas[i].abertaEm = '';
                }

                var contagemFechamentos = {};
                var fechSets = {};
                var pessoasMapa = {};
                var finMapa = {}, finLista = [];

                for (var k = 0; k < estado.pedidosGlobais.length; k++) {
                    var p = estado.pedidosGlobais[k];
                    if (!p || !p.mesa) continue;
                    if (typeof p.obs === 'string' && /^\[TESTE(:[^\]]*)?\]/i.test(p.obs)) {
                        p.teste = true;
                        var mTeste = p.obs.match(/^\[TESTE:([^\]]*)\]\s*/i);
                        if (mTeste) p.testePor = mTeste[1];
                        p.obs = p.obs.replace(/^\[TESTE(:[^\]]*)?\]\s*/i, '');
                    }
                    if (p.status === 'fechado') {
                        var kf = String(p.mesa) + '|' + String(p.tchau);
                        if (!finMapa[kf]) { finMapa[kf] = { k: kf, mesa: String(p.mesa), tchau: String(p.tchau), abertura: p.oi || '', itens: [], total: 0, forma: p.forma || '' }; finLista.push(finMapa[kf]); }
                        if (p.teste) finMapa[kf].teste = true;
                        var pcf = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                        var prf = p.preco || (pcf ? pcf.preco : 0);
                        finMapa[kf].itens.push({ produto: p.produto, qnt: Number(p.qnt || 1), preco: prf, obs: p.obs || '', pedidoEm: p.pedidoEm || p.oi || '' });
                        finMapa[kf].total += Number(p.qnt || 1) * prf;
                    }
                    var baseId = String(p.mesa).split('.')[0];
                    var mesaObj = estado.mesas.find(function(m) { return m.id == baseId; });
                    if (ehPessoa(p.mesa) || ehVip(p.mesa)) {
                        if (p.status === 'fechado') continue;
                        if (!pessoasMapa[p.mesa]) {
                            pessoasMapa[p.mesa] = { id: p.mesa, pessoa: true, vip: ehVip(p.mesa), nome: ehVip(p.mesa) ? String(p.mesa) : String(p.mesa).substring(PREFIXO_PESSOA.length), status: 'ocupada', itens: [], idExibicao: p.mesa, contadorFehamentos: 0, abertaEm: p.oi || '' };
                        }
                        mesaObj = pessoasMapa[p.mesa];
                        var pc = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                        mesaObj.itens.push({ idItem: k, produto: p.produto, qnt: Number(p.qnt || 1), preco: pc ? pc.preco : (p.preco || 0), tipo: p.tipo || 'bar', statusPreparo: p.statusPreparo || 'pendente', linha: p.linha, mesaKey: p.mesa, obs: p.obs || '', teste: !!p.teste });
                        continue;
                    }

                    if (mesaObj) {
                        if (p.status === 'fechado') {
                            fechSets[baseId] = fechSets[baseId] || {};
                            if (!p.teste) { // fechamento de teste não muda o número da mesa
                                fechSets[baseId][String(p.tchau)] = true;
                                contagemFechamentos[baseId] = Object.keys(fechSets[baseId]).length;
                            }
                            mesaObj.status = 'livre';
                        } else {
                            mesaObj.status = 'ocupada';
                            mesaObj.idExibicao = p.mesa;
                            if (!mesaObj.abertaEm) mesaObj.abertaEm = p.oi || '';
                            
                            var prodCard = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                            var precoUnit = prodCard ? prodCard.preco : (p.preco || 6.00);

                            mesaObj.itens.push({
                                idItem: k,
                                produto: p.produto,
                                qnt: Number(p.qnt || 1),
                                preco: precoUnit,
                                tipo: p.tipo || 'bar',
                                statusPreparo: p.statusPreparo || 'pendente',
                                linha: p.linha,
                                mesaKey: p.mesa,
                                obs: p.obs || '',
                                teste: !!p.teste
                            });
                        }
                    }
                }

                // comanda nova ou que acabou de receber pedido sobe para o topo (mesma ordem em Caixa, Abertas e VIP)
                estado.mesas.sort(function(a, b) { return chaveRecencia(b) - chaveRecencia(a); });

                // pessoas: as que têm pedidos em aberto + as cadastradas que ainda não pediram
                estado.pessoas = [];
                for (var chv2 in pessoasMapa) estado.pessoas.push(pessoasMapa[chv2]);
                estado.pessoasNovas.forEach(function(chave) {
                    if (!pessoasMapa[chave]) {
                        estado.pessoas.push({ id: chave, pessoa: true, vip: ehVip(chave), nome: ehVip(chave) ? chave : chave.substring(PREFIXO_PESSOA.length), status: 'ocupada', itens: [], idExibicao: chave, contadorFehamentos: 0, abertaEm: '' });
                    }
                });
                estado.pessoas.sort(function(a, b) { return chaveRecencia(b) - chaveRecencia(a); });
                finLista.sort(function(a, b) { return ordemData(b.tchau).localeCompare(ordemData(a.tchau)); });
                // comandas que acabei de fechar aparecem na hora em Finalizadas, até a planilha confirmar (aí vale a versão dela)
                if (estado.finPend && estado.finPend.length) {
                    estado.finPend = estado.finPend.filter(function(fp) {
                        if (Date.now() - fp.t > 120000) return false;
                        var nSrv = finLista.filter(function(e) { return e.mesa === fp.mesa; }).length;
                        return nSrv <= fp.antes;
                    });
                    estado.finPend.forEach(function(fp) { finLista.unshift(fp); });
                }
                estado.finalizadas = finLista;

                for (var mId in contagemFechamentos) {
                    var mObj = estado.mesas.find(function(m) { return m.id == mId; });
                    if (mObj && mObj.status === 'livre') {
                        mObj.contadorFehamentos = contagemFechamentos[mId];
                    }
                }
                // comanda recém-criada que já recebeu pedido deixa de ser "nova"; as fechadas e vazias somem da tela
                estado.mesasNovas = estado.mesasNovas.filter(function(n) {
                    var mm = estado.mesas.find(function(m) { return String(m.id) === String(n); });
                    return mm && mm.status !== 'ocupada';
                });
                estado.mesasVisiveis = estado.mesas.filter(function(m) {
                    return m.status === 'ocupada' || estado.mesasNovas.some(function(n) { return String(n) === String(m.id); });
                });
            } catch (err) {
                console.log("Erro ao processar pedidos:", err);
            }
        }

        function capturarValoresFormulario() {
            try {
                var sel = document.getElementById('select-produto');
                var qtd = document.getElementById('input-qtd');
                if (sel) estado.produtoSelecionadoCache = sel.value; // inclui "em branco"
                if (qtd && qtd.value) estado.quantidadeCache = qtd.value;
                var obsEl = document.getElementById('input-obs');
                if (obsEl) estado.obsCache = obsEl.value;
                var telEl = document.getElementById('input-tel-pessoa');
                if (telEl) estado.telCache = telEl.value;
                var nmEl = document.getElementById('input-nome-mesa');
                if (nmEl) estado.nomeMesaCache = nmEl.value;
            } catch (err) {}
        }

        function marcarConexao(ok) {
            var el = document.getElementById('sync-indicator');
            if (!el) return;
            el.textContent = ok ? 'Conectado' : 'Desconectado';
            if (ok) el.classList.remove('off'); else el.classList.add('off');
        }
        // A atualização automática (a cada 5 s) não redesenha a tela enquanto alguém está escolhendo produto,
        // digitando quantidade ou observação: redesenhar fecharia a lista aberta e tiraria o cursor do campo.
        function formEmUso() {
            var ae = document.activeElement;
            return !!(ae && (ae.id === 'select-produto' || ae.id === 'busca-produto' || ae.id === 'input-qtd' || ae.id === 'input-obs' || ae.id === 'input-tel-pessoa' || ae.id === 'tel-ni' || ae.id === 'input-nome-mesa' || String(ae.className || '').indexOf('rap-campo') >= 0));
        }
        function renderizarSeLivre() {
            if (formEmUso()) { estado.renderAdiado = Date.now(); estado.renderPend = true; return; }
            estado.renderPend = false;
            renderizar();
        }
        function sincronizar() {
            if (ESTACAO) return Promise.resolve();
            capturarValoresFormulario();
            var meuSeq = (estado.seqReq = (estado.seqReq || 0) + 1);
            estado.sincT = Date.now();
            return fetch(API_URL)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    estado.sincT = 0;
                    // resposta mais antiga que outra já aplicada (chegou fora de ordem): descarta, senão o status "volta"
                    if (meuSeq < (estado.seqAplicada || 0)) return;
                    estado.seqAplicada = meuSeq;
                    marcarConexao(!!data);
                    if (data) {
                        if (data.produtos && data.produtos.length > 0) {
                            var antesCard = JSON.stringify(CARDAPIO);
                            CARDAPIO = data.produtos;
                            CARDAPIO_OK = true;
                            try { localStorage.setItem('cardapioCache', JSON.stringify(CARDAPIO)); } catch (eC2) {}
                            // janela de venda rápida aberta: atualiza a lista de produtos assim que chegar
                            if (estado.vr && !estado.vr.enviando && antesCard !== JSON.stringify(CARDAPIO)) { vrForm(); vrDesenhar(); }
                        }
                        if (data.frequentes) estado.frequentes = data.frequentes;
                        if (data.clientes) estado.clientes = data.clientes;
                        if (data.telefones) estado.telefones = data.telefones;
                        if (data.usuario) { estado.usuario = data.usuario; estado.versao = data.versao || 'antiga'; atualizarUsuario(); }
                        if (data.pedidos) {
                            limparFechando(data.pedidos);
                            estado.pedidosGlobais = data.pedidos;
                            // pedidos enviados que o servidor ainda não gravou continuam na tela
                            estado.pendentes = estado.pendentes.filter(function(pd) {
                                if (Date.now() - pd.t > 60000) return false;
                                var n = data.pedidos.filter(function(x) { return x.status !== 'fechado' && String(x.mesa) === String(pd.pedido.mesa) && x.produto === pd.pedido.produto; }).length;
                                return n < pd.base + 1;
                            });
                            estado.pendentes.forEach(function(pd) { data.pedidos.push(pd.pedido); });
                            data.pedidos = aplicarFechando(data.pedidos);
                            estado.pedidosGlobais = data.pedidos;
                            // mudanças de status feitas aqui: ficam na tela até a planilha confirmar (e são reenviadas)
                            for (var kk = 0; kk < data.pedidos.length; kk++) {
                                var chv = chavePedido(data.pedidos, kk);
                                var ov = estado.overrides[chv];
                                if (!ov) continue;
                                var pk = data.pedidos[kk];
                                if (pk.statusPreparo === ov.status) { if (!ov.ok) ov.ok = Date.now(); }
                                // depois de confirmado, a mudança continua valendo por 25 s (protege contra respostas atrasadas)
                                if ((ov.ok && Date.now() - ov.ok > 25000) || Date.now() - ov.t > 600000) {
                                    delete estado.overrides[chv];
                                } else {
                                    pk.statusPreparo = ov.status;
                                    if (pk.linha) ov.linha = pk.linha;
                                    if (!ov.ok && !ov.enviando && Date.now() - ov.ult > 6000) enviarStatus(chv);
                                }
                            }
                            detectarSons(data.pedidos);
                            // nada mudou desde a última consulta? não refaz a tela (poupa o iPad e evita piscar)
                            var sigNova = JSON.stringify([data.pedidos, CARDAPIO, data.frequentes, data.clientes, data.telefones, data.usuario, estado.versao,
                                (estado.finPend || []).length, (estado.cancelPend || []).length, Object.keys(estado.fechando || {}).length, Object.keys(estado.vrOcultas || {}).length,
                                estado.pessoasNovas.length, estado.mesasNovas.length, estado.abaAtiva, estado.mesaSelecionadaId]);
                            if (sigNova === estado.sigUlt && !estado.renderPend) return;
                            estado.sigUlt = sigNova;
                            processarPedidos();
                        }
                        renderizarSeLivre();
                    }
                })
                .catch(function(e) { 
                    estado.sincT = 0;
                    console.log("Aviso de rede (usando dados locais):", e); marcarConexao(false);
                    renderizarSeLivre(); 
                });
        }

        function mudarAba(aba) {
            if (ehCont() && (aba === 'caixa' || aba === 'cozinha' || aba === 'bar')) { aba = 'abertas'; } // cont não lança pedido: nem entra nessas páginas
            estado.abaAtiva = aba;
            if (aba === 'caixa') {
                estado.mesaSelecionadaId = null;
            }
            estado.produtoSelecionadoCache = ''; // trocar de página também zera o produto
            
            var btnCaixa = document.getElementById('btn-aba-caixa');
            var btnCozinha = document.getElementById('btn-aba-cozinha');
            var btnBar = document.getElementById('btn-aba-bar');
            var btnAbertas = document.getElementById('btn-aba-abertas');

            if (btnCaixa) btnCaixa.className = "btn-tab " + (aba === 'caixa' ? 'active-caixa' : '');
            if (btnCozinha) btnCozinha.className = "btn-tab " + (aba === 'cozinha' ? 'active-cozinha' : '');
            if (btnBar) btnBar.className = "btn-tab " + (aba === 'bar' ? 'active-bar' : '');
            if (btnAbertas) btnAbertas.className = "btn-tab " + (aba === 'abertas' ? 'active-abertas' : '');
            var btnFin = document.getElementById('btn-aba-finalizadas');
            if (btnFin) btnFin.className = "btn-tab " + (aba === 'finalizadas' ? 'active-abertas' : '');
            var btnVip = document.getElementById('btn-aba-vip');
            if (btnVip) btnVip.className = "btn-tab " + (aba === 'vip' ? 'active-vip' : '');
            var btnLogs = document.getElementById('btn-aba-logs');
            if (btnLogs) btnLogs.className = "btn-tab " + (aba === 'logs' ? 'active-logs' : '');
            if (aba === 'logs') { if (!(estado.usuario && estado.usuario.supreme)) { aba = estado.abaAtiva = ehCont() ? 'abertas' : 'caixa'; mudarAba(aba); return; } carregarLogs(); }
            var btnRel = document.getElementById('btn-aba-relatorios');
            if (btnRel) btnRel.className = "btn-tab " + (aba === 'relatorios' ? 'active-logs' : '');
            if (aba === 'relatorios') { if (!(estado.usuario && (estado.usuario.admin || ehCont()))) { aba = estado.abaAtiva = 'caixa'; mudarAba('caixa'); return; } if (estado.relModoRelatorios === 'funcionarios') carregarRelatorios(); else carregarRelatoriosPeriodo(); }

        // ---- Diário: calendário semanal (domingo a sábado) pra escolher a semana; mostra só os dias fechados daquela semana ----

            if (!estado.som.ligado) return;
            var c = somCtx(); if (!c) return;
            try {
                if (c.state === 'suspended') c.resume();
                var t0 = c.currentTime;
                (SONS[tipo] || SONS.pronto).forEach(function(n) {
                    var o = c.createOscillator(), g = c.createGain();
                    o.type = 'sine'; o.frequency.value = n[0];

        function fecharJanelaFechamento() {

            m.itens.forEach(function(it) { c.itens.push({ produto: it.produto, qnt: it.qnt, preco: it.preco, obs: it.obs || '', pedidoEm: '' }); c.total += it.qnt * it.preco; });

        // Passo 2: confirma (exige a forma de pagamento) e fecha
        // Comandas que o usuário acabou de fechar: somem da tela na hora, enquanto a planilha (e o PDF) terminam.
        // Só escondem os itens que já existiam no momento do fechamento; pedido novo na mesma mesa aparece normal.
        function sigItem(p) { return String(p.mesa) + '|' + String(p.produto) + '|' + String(p.pedidoEm || ''); }
        function aplicarFechando(lista) {
            var f = estado.fechando || {}, ks = Object.keys(f), vo = estado.vrOcultas || {}, cp = estado.cancelPend || [];
            if (!ks.length && !Object.keys(vo).length && !cp.length) return lista;
            var base = lista.filter(function(p) {
                if (p.status === 'fechado') return true;
                if (vo[String(p.mesa)] && Date.now() - vo[String(p.mesa)] < 180000) return false;
                for (var i = 0; i < ks.length; i++) { if (f[ks[i]].sigs[sigItem(p)]) return false; }
                return true;
            });
            if (!cp.length) return base;
            // itens cancelados aqui: somem na hora e ficam assim até a planilha confirmar
            var out = [];
            base.forEach(function(p) {
                if (p.status !== 'fechado') {
                    var sg = sigItem(p), rest = Number(p.qnt), tocou = false;
                    cp.forEach(function(e) { if (e.sig === sg && Number(p.qnt) === e.qo) { rest -= e.q; tocou = true; } });
                    if (tocou) { if (rest <= 0) return; var c = {}; for (var kk in p) c[kk] = p[kk]; c.qnt = rest; out.push(c); return; }
                }
                out.push(p);

            var f = estado.fechando || {};
            Object.keys(f).forEach(function(k) {

        function confirmarFechamento() {
            var f = estado.fechamento, mesaObj = f && acharMesa(f.id);
            if (!mesaObj) { fecharJanelaFechamento(); return; }
            var teste = (souTeste() || ehMesaTesteFixa(mesaObj.id) || ehMesaTesteFixa(mesaObj.idExibicao)) && mesaTeste(mesaObj), descartar = false;
            if (teste) { var cd = document.getElementById('fech-descartar'); descartar = !cd || cd.checked; }   // supreme: só fecha a comanda de teste, sem Finalizar dia
            var precisaForma = mesaObj.itens.length > 0 && !teste;
            var livre = (estado.usuario && estado.usuario.admin && !teste) ? String(f.livre || '').replace(/\s+/g, ' ').trim().substring(0, 60) : '';
            if (precisaForma && !f.forma && !livre) { alert('Selecione a forma de pagamento: Débito, Crédito, PIX ou Dinheiro.'); return; }
            var forma = precisaForma ? (livre || f.forma) : '';
            if (teste) forma = 'Teste'; // comanda de teste: sempre registrada como TESTE
            fecharJanelaFechamento();

                var totalFp = 0, itensFp = mesaObj.itens.map(function(it) { totalFp += Number(it.qnt) * Number(it.preco); return { produto: it.produto, qnt: Number(it.qnt), preco: it.preco, obs: it.obs || '', pedidoEm: '' }; });
                fpNovo = { k: 'pend|' + idAlvo + '|' + Date.now(), mesa: String(idAlvo), tchau: tchauLocal, abertura: mesaObj.abertaEm || '', itens: itensFp, total: totalFp, forma: forma, teste: !!teste, pend: true, t: Date.now(),
                           antes: (estado.finalizadas || []).filter(function(e) { return e.mesa === String(idAlvo) && !e.pend; }).length };
                if (!estado.finPend) estado.finPend = [];
                estado.finPend.push(fpNovo);
            }
            if (qtdSigs > 0) {
                regFech = { sigs: sigs, t: Date.now() };
                if (!estado.fechando) estado.fechando = {};
                estado.fechando[idAlvo + '#' + Date.now()] = regFech;
                estado.pedidosGlobais = aplicarFechando(estado.pedidosGlobais);

                if (fpNovo && estado.finPend) estado.finPend = estado.finPend.filter(function(e) { return e !== fpNovo; });
                if (regFech && estado.fechando) Object.keys(estado.fechando).forEach(function(k) { if (estado.fechando[k] === regFech) delete estado.fechando[k]; });
                alert('Não foi possível fechar a comanda (sem conexão com a planilha). Confira e tente de novo.');
                sincronizar();

            var aposFechar = function() { sincronizar(); };

            fetch(API_URL + '?acao=fechar_mesa&mesa=' + encodeURIComponent(idAlvo) + '&forma=' + encodeURIComponent(livre ? '' : forma) + (livre ? '&forma_livre=' + encodeURIComponent(livre) : '') + (descartar ? '&descartar=1' : ''))

                    if (teste) { desfazerFechar(); return; } // teste nunca usa o método antigo (poderia gravar de verdade)
                    return fecharMesaPost(idAlvo).then(aposFechar);
                })
                .catch(function() { if (teste) { desfazerFechar(); return; } fecharMesaPost(idAlvo).then(aposFechar).catch(desfazerFechar); });
        }

            var pedidos = alvo.map(function(a) { return { p: estado.pedidosGlobais[a.it.idItem], a: a }; }).filter(function(x) { return x.p && x.p.linha; });

                  '&nome=' + encodeURIComponent(nome) + '&forma=' + encodeURIComponent(livre ? '' : d.formaDiv) + (livre ? '&forma_livre=' + encodeURIComponent(livre) : ''))

                .then(function(r) {

            html = String(html || '').replace(/<\s*script[\s\S]*?(<\s*\/\s*script\s*>|$)/gi, '')

        // Painel lateral de uma comanda: lançar produtos, itens, imprimir e fechar (usado no Caixa e em Abertas)

                    }

                    // mais novo primeiro: a posição do item na lista segue a ordem de chegada na planilha
                    itensKDS.sort(function(a, b) { return b.idItem - a.idItem; });

                    var kdsHtml = '';
                    if (itensKDS.length === 0) {
                        kdsHtml = '<p style="grid-column: span 4; text-align: center; padding: 3rem; color:#000; font-weight:bold;">Nenhum item pendente no momento.</p>';
                    } else {
                        for (var z = 0; z < itensKDS.length; z++) {
                            var kItem = itensKDS[z];
                            var classePreparo = kItem.statusPreparo;
                            
                            kdsHtml += '<div class="kds-card ' + classePreparo + (classePreparo === 'pendente' ? ' piscando' : '') + (kItem.teste ? ' teste' : '') + '" onclick="lidarComCliqueCard(' + kItem.idItem + ')">' +
                                '<div style="display: flex; justify-content: space-between;"><span class="badge">' + esc(kItem.mesa) + (kItem.teste ? ' ' + etiquetaTeste() : '') + '</span><span style="font-size:0.75rem; font-weight:bold;">' + kItem.statusPreparo.toUpperCase() + '</span></div>' +
                                '<div><div style="font-size: 1.2rem; font-weight: bold;">' + kItem.qnt + 'x ' + esc(kItem.produto) + '</div>' + htmlObs(kItem.obs, true) + '</div>' +
                                '<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">' +
                                    '<span style="font-size: 0.65rem; font-weight: bold;">1 toque: preparando | 2 toques: pronto</span>' +
                                    '<button class="btn-acao-entregue" onclick="event.stopPropagation(); mudarEstadoPorId(' + kItem.idItem + ', \'entregue\')">Marcar Entregue</button>' +
                                '</div>' +
                            '</div>';
                        }
                    }

                    var tituloPainel = ehCozinha ? '🍳 Cozinha' : '🍻 Bar';
                    main.innerHTML = '<div><h2 style="margin-bottom: 1rem; color:#000;">' + tituloPainel + '</h2><div class="kds-grid">' + kdsHtml + '</div></div>';
                }
                var btnBar2 = document.getElementById('btn-aba-bar'), btnCoz2 = document.getElementById('btn-aba-cozinha');
                if (btnBar2) { var nBar = contarKDS(false); btnBar2.textContent = '🍻 Bar' + (nBar > 0 ? ' (' + nBar + ')' : ''); }
                if (btnCoz2) { var nCoz = contarKDS(true); btnCoz2.textContent = '🍳 Cozinha' + (nCoz > 0 ? ' (' + nCoz + ')' : ''); }
                var btnAb = document.getElementById('btn-aba-abertas');
                if (btnAb) {
                    var nAb = todasMesas().filter(function(m) { return m.status === 'ocupada' && m.itens.length > 0 && !m.vip; }).length;
                    btnAb.textContent = '📋 Abertas' + (nAb > 0 ? ' (' + nAb + ')' : '');
                }
                var btnFn = document.getElementById('btn-aba-finalizadas');
                if (btnFn) btnFn.textContent = '✅ Finalizadas' + (estado.finalizadas.length > 0 ? ' (' + estado.finalizadas.length + ')' : '');
            } catch (err) {
                console.log("Erro crítico no renderizar:", err);
            }
        }


        // ---------- estação de impressão (abrir com ?estacao=1 no notebook que tem a impressora) ----------
        function iniciarEstacao() {
            var impressas = 0, ocupado = false, fila = [], rodando = false;
            document.querySelector('main').innerHTML = '<div style="text-align:center; color:#fff; padding:2rem;"><h1>🖨️ Estação de impressão</h1>' +
                '<p style="font-size:1.1rem;">Deixe esta tela aberta. Os pedidos de impressão dos iPads saem aqui sozinhos.</p>' +
                '<div id="est-status" style="font-size:1.5rem; font-weight:bold; margin:1.5rem 0;">Aguardando...</div>' +
                '<div id="est-ultima" style="font-size:0.95rem;"></div></div>';
            function z(n) { return (n < 10 ? '0' : '') + n; }
            function marcar(txt, ok) {
                var el = document.getElementById('est-status');
                if (el) { el.textContent = txt; el.style.color = ok ? '#bbf7d0' : '#fecaca'; }
            }
            function proximo() {
                if (rodando || !fila.length) return;
                rodando = true;
                var j = fila.shift();
                imprimirLocal(j.html);
                impressas++;
                var d = new Date();
                var u = document.getElementById('est-ultima');
                if (u) u.textContent = 'Última impressão: ' + (j.titulo || 'comanda') + ' às ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ' (total hoje: ' + impressas + ')';
                setTimeout(function() { rodando = false; proximo(); }, 2500);
            }
            function buscar() {
                if (ocupado) return;
                ocupado = true;
                fetch(API_URL + '?acao=fila_pegar')
                    .then(function(res) { return res.json(); })
                    .then(function(r) {
                        ocupado = false;
                        if (r && r.result === 'success') {
                            marcar('✅ Conectado — aguardando pedidos', true);
                            (r.jobs || []).forEach(function(j) { fila.push(j); });
                            proximo();
                        } else { marcar('⚠️ Erro: ' + ((r && r.error) || 'resposta inválida'), false); }
                    })
                    .catch(function() { ocupado = false; marcar('⚠️ Sem conexão ou sem login', false); });
            }
            buscar();
            setInterval(buscar, 3000);
        }

        // Executa imediatamente e sincroniza em segundo plano
        if (ESTACAO) {
            if (!CHAVE) pedirChave('');
            iniciarEstacao();
        } else {
            renderizar();
            if (!CHAVE) pedirChave('');
            sincronizar();
            setInterval(function() { if (estado.sincT && Date.now() - estado.sincT < 8000) return; sincronizar(); }, 3000);   // não empilha consultas quando o servidor está lento
        }
    </script>
</body>
