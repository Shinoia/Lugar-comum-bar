    <title>Lugar Comum Bar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #dc2626; color: #000; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #b91c1c; border-bottom: 2px solid #991b1b; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        h1 { font-size: 1.5rem; font-weight: bold; color: #facc15; }
        .nav-buttons { display: flex; gap: 0.5rem; background: #b91c1c; padding: 0.25rem; border-radius: 0.75rem; border: 2px solid #7f1d1d; align-items: center; }
        button { cursor: pointer; border: none; font-weight: bold; font-size: 0.875rem; border-radius: 0.5rem; padding: 0.5rem 1rem; color: #000; }
        .btn-tab { background: transparent; color: #1e1b4b; }
        .active-caixa { background: #facc15; color: #000; }
        .active-cozinha { background: #f97316; color: #000; }
        .active-bar { background: #38bdf8; color: #000; }
        .active-abertas { background: #c4b5fd; color: #000; }
        .btn-dia { background: #4ade80; border: 2px solid #000; }
        main { flex: 1; padding: 1.5rem; display: block; }
        .grid-caixa { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media(min-width: 1024px) { .grid-caixa { grid-template-columns: 2fr 1fr; } }
        .mesas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        @media(min-width: 640px) { .mesas-grid { grid-template-columns: repeat(4, 1fr); } }
        .mesa-card { background: #ef4444; border: 2px solid #b91c1c; border-radius: 0.75rem; padding: 1rem; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 8rem; color: #000; }
        .mesa-card.ocupada { border-color: #000; background: #fef08a; }
        .mesa-card.teste { background: #c4b5fd !important; border-color: #5b21b6 !important; }
        .kds-card.teste { border: 4px dashed #6d28d9; }
        .mesa-card.selecionada { border-color: #000; box-shadow: 0 0 0 3px rgba(0,0,0,0.3); }
        .painel-lateral { background: #b91c1c; border: 2px solid #991b1b; border-radius: 1rem; padding: 1.25rem; display: flex; flex-direction: column; color: #000; }
        .form-grupo { background: #ef4444; padding: 0.75rem; border-radius: 0.75rem; border: 2px solid #b91c1c; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        select, input { background: #fff; border: 2px solid #000; border-radius: 0.5rem; padding: 0.5rem; font-size: 0.875rem; width: 100%; font-weight: bold; color: #000; }
        .btn-lancar { background: #facc15; font-weight: bold; width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 2px solid #000; color: #000; }
        .lista-itens { flex: 1; overflow-y: auto; max-height: 14rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .item-row { background: #ef4444; padding: 0.75rem; border-radius: 0.5rem; border: 2px solid #b91c1c; display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; color: #000; }
        .kds-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 1rem; }
        @media(min-width: 768px) { .kds-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 1024px) { .kds-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .kds-card { padding: 1rem; border-radius: 0.75rem; border: 2px solid #991b1b; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 12rem; gap: 0.5rem; background: #f472b6; color: #000; }
        .kds-card.preparando { background: #f97316; }
        .kds-card.pronto { background: #4ade80; }
        .kds-card.entregue { background: #facc15; }

        .badge { padding: 0.125rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold; background: #fff; color: #000; }
        .btn-acao-entregue { background: #fff; border: 2px solid #000; border-radius: 0.4rem; padding: 0.3rem 0.5rem; font-size: 0.75rem; font-weight: bold; color: #000; text-align: center; }
.bloqueado header, .bloqueado main { visibility: hidden !important; }
        .sync-status.off { background: #ff0000 !important; color: #fff !important; border-color: #fff; animation: piscaOff 1s infinite; }
        @keyframes piscaOff { 50% { opacity: 0.55; } }
        .sync-status { font-size: 0.75rem; font-weight: bold; background: #4ade80; padding: 0.25rem 0.5rem; border-radius: 0.25rem; border: 1px solid #000; color: #000; }
            /* Safari antigo (iPad com iOS 12) não conhece "gap" em flexbox: espaçamento reserva */
        .sem-gap header > *, .sem-gap .nav-buttons > *, .sem-gap [style*="display:flex"] > *, .sem-gap [style*="display: flex"] > * { margin-right: 0.4rem; margin-bottom: 0.3rem; }
        .sem-gap .form-grupo > *, .sem-gap .lista-itens > *, .sem-gap .kds-card > *, .sem-gap [style*="flex-direction:column"] > * { margin-right: 0; margin-bottom: 0.4rem; }
        html { -webkit-text-size-adjust: 100%; }
        body { padding-top: env(safe-area-inset-top); }
    </style>
</head>
<body>
    <header>
        <div>
            <h1><span id="icone-foice">☭</span> Lugar Comum Bar</h1>
        </div>
        <div class="nav-buttons">
            <button id="btn-aba-caixa" class="btn-tab active-caixa" onclick="mudarAba('caixa')">🧮 Caixa / Mesas</button>
            <button id="btn-aba-cozinha" class="btn-tab" onclick="mudarAba('cozinha')">🍳 Cozinha</button>
            <button id="btn-aba-bar" class="btn-tab" onclick="mudarAba('bar')">🍻 Bar</button>
            <button id="btn-aba-abertas" class="btn-tab" onclick="mudarAba('abertas')">📋 Abertas</button>
            <button id="btn-aba-finalizadas" class="btn-tab" onclick="mudarAba('finalizadas')">✅ Finalizadas</button>
            <button class="btn-dia" id="btn-dia" onclick="finalizarDia()">🏁 Finalizar Dia</button>
            <span id="info-usuario" class="sync-status" style="background:#fff;"></span>
            <button class="btn-tab" onclick="sair()" title="Sair deste aparelho">Sair</button>
        </div>
    </header>
    <div style="display:flex; justify-content:flex-end; padding:0.35rem 1rem 0;"><span id="sync-indicator" class="sync-status">Conectado</span></div>

    <main id="app-conteudo"></main>

    <script>
        (function() {
            try {
                var a = document.createElement('div'); a.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
                a.appendChild(document.createElement('i')); a.appendChild(document.createElement('i'));
                a.firstChild.style.height = a.lastChild.style.height = '1px';
                document.body.appendChild(a);
                var ok = a.offsetHeight === 3;
                document.body.removeChild(a);
                if (!ok) document.documentElement.className += ' sem-gap';
            } catch (e) {}
        })();
        var ESTACAO = /[?&]estacao=1/.test(location.search); // notebook do bar: imprime sozinho o que os iPads enviam
        var API_URL = "https://script.google.com/macros/s/AKfycbyawZahFXeytjgTj2-yId6TIQwF7RoSqF2alHUj4AF46Huhmsl4keW4bUm6sakf8p_M/exec";

        // ---------- login da equipe (usuário + senha da aba "Key" da planilha) ----------
        // Todas as chamadas ao servidor levam usuário e senha; sem eles o servidor não responde.
        // O login fica guardado neste aparelho até o fim do dia de trabalho (06:00) e sobrevive a atualizações da página.
        function diaDeTrabalho() { return new Date(Date.now() - 6 * 3600 * 1000).toDateString(); }
        function lerSessao() {
            try {
                var v = JSON.parse(localStorage.getItem('lcb_sessao2') || 'null');
                return (v && v.dia === diaDeTrabalho() && v.chave && v.usuario) ? v : null;
            } catch (e) { return null; }
        }
        function guardarSessao(usuario, chave) {
            try { if (chave) localStorage.setItem('lcb_sessao2', JSON.stringify({ usuario: usuario, chave: chave, dia: diaDeTrabalho() })); else localStorage.removeItem('lcb_sessao2'); } catch (e) {}
        }
        var SESSAO = lerSessao();
        var CHAVE = SESSAO ? SESSAO.chave : '';
        var USUARIO = SESSAO ? SESSAO.usuario : '';
        var fetchOriginal = fetch;
        fetch = function(u, o) {
            if (String(u).indexOf(API_URL) !== 0) return fetchOriginal(u, o);
            if (CHAVE && !lerSessao()) { CHAVE = ''; USUARIO = ''; } // virou o dia de trabalho
            if (!CHAVE) { pedirChave(''); return Promise.reject(new Error('sem login')); }
            if (o && o.method === 'POST') {
                var corpo = {};
                try { corpo = JSON.parse(o.body); } catch (e) {}
                corpo.chave = CHAVE; corpo.usuario = USUARIO;
                var o2 = {}; for (var k in o) o2[k] = o[k];
                o2.body = JSON.stringify(corpo);
                return fetchOriginal(u, o2);
            }
            u = String(u) + (String(u).indexOf('?') >= 0 ? '&' : '?') + 'chave=' + encodeURIComponent(CHAVE) + '&usuario=' + encodeURIComponent(USUARIO);
            return fetchOriginal(u, o).then(function(res) {
                return res.clone().json().then(function(j) {
                    if (j && j.negado) {
                        CHAVE = ''; USUARIO = ''; guardarSessao('', '');
                        pedirChave(j.off ? 'Seu acesso está desativado (off).' : 'Usuário ou senha incorretos.');
                    }
                    return res;
                }).catch(function() { return res; });
            });
        };
        function pedirChave(aviso) {
            if (document.getElementById('janela-chave')) return;
            var el = document.createElement('div');
            el.id = 'janela-chave';
            el.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; z-index:100; padding:1rem;';
            el.innerHTML = '<div style="background:#fff; border:3px solid #000; border-radius:0.75rem; padding:1.25rem; width:100%; max-width:22rem; color:#000;">' +
                '<h3 style="margin-bottom:0.75rem;">🔒 Lugar Comum Bar</h3>' +
                (aviso ? '<p style="color:#b91c1c; font-weight:bold; margin-bottom:0.5rem;">' + esc(aviso) + '</p>' : '') +
                '<label style="font-size:0.85rem;">Usuário:</label>' +
                '<input type="text" id="input-usuario" autocomplete="username" style="width:100%; margin:0.25rem 0 0.5rem;">' +
                '<label style="font-size:0.85rem;">Senha:</label>' +
                '<input type="password" id="input-chave" autocomplete="current-password" style="width:100%; margin:0.25rem 0 0.75rem;" onkeydown="if(event.key===\'Enter\') entrarComChave()">' +
                '<button type="button" onclick="entrarComChave()" style="background:#facc15; border:2px solid #000; width:100%;">Entrar</button></div>';
            document.body.appendChild(el);
            document.body.classList.add('bloqueado');
            var inp = document.getElementById('input-usuario');
            if (inp && inp.focus) inp.focus();
        }
        function entrarComChave() {
            var u = String((document.getElementById('input-usuario') || {}).value || '').trim();
            var v = String((document.getElementById('input-chave') || {}).value || '').trim();
            if (!u || !v) return;
            CHAVE = v; USUARIO = u;
            guardarSessao(u, v);
            var el = document.getElementById('janela-chave');
            if (el && el.parentNode) el.parentNode.removeChild(el);
            document.body.classList.remove('bloqueado');
            sincronizar();
        }
        function sair() {
            if (!confirm('Sair do sistema neste aparelho?')) return;
            CHAVE = ''; USUARIO = ''; guardarSessao('', '');
            estado.usuario = null;
            atualizarUsuario();
            pedirChave('');
        }
        function atualizarUsuario() {
            var el = document.getElementById('info-usuario');
            if (!el) return;
            var bd = document.getElementById('btn-dia');
            if (bd) bd.style.display = (estado.usuario && !estado.usuario.admin) ? 'none' : ''; // user não vê Finalizar Dia
            el.textContent = estado.usuario ? ('👤 ' + estado.usuario.nome + (estado.usuario.supreme ? ' (supreme)' : estado.usuario.admin ? ' (admin)' : ' (user)') + ' · script ' + (estado.versao || '?')) : '';
        }
        function exigirAdmin() {
            if (estado.usuario && !estado.usuario.admin) { alert('Somente administradores podem fazer isso.'); return false; }
            return true;
        }

        // Cardápio de segurança preenchido para garantir funcionamento imediato
        var CARDAPIO = [
            { nome: "Refrigerante", preco: 6.00, estoque: 50, tipo: "bar" },
            { nome: "Kariri", preco: 10.00, estoque: 30, tipo: "bar" },
            { nome: "Conserva", preco: 15.00, estoque: 20, tipo: "cozinha" }
        ];
        // última lista de produtos recebida da planilha fica guardada neste aparelho: abre instantâneo, sem esperar a planilha
        var CARDAPIO_OK = false;
        try {
            var cacheCard = JSON.parse(localStorage.getItem('cardapioCache') || 'null');
            if (cacheCard && cacheCard.length) { CARDAPIO = cacheCard; CARDAPIO_OK = true; }
        } catch (eC) {}

        var estado = {
            abaAtiva: 'caixa',
            mesaSelecionadaId: null,
            produtoSelecionadoCache: '',
            quantidadeCache: 1,
            pedidosGlobais: [],
            pendentes: [],
            overrides: {},
            obsCache: '',
            mesas: [],
            pessoas: [],
            pessoasNovas: [],
            finalizadas: [],
            frequentes: [],
            clientes: [],
            telefones: [],
            usuario: null,
            fechamento: null
        };
        var PREFIXO_PESSOA = 'Pessoa: ';

        estado.mesasNovas = []; // números de comanda digitados em "+ Nova comanda" que ainda não receberam pedido

        var CORES_STATUS = { pendente: '#f472b6', preparando: '#f97316', pronto: '#4ade80', entregue: '#facc15' };
        function corStatus(st) { return CORES_STATUS[st] || '#fff'; }

        // chave estável de um item aberto: mesa + produto + ordem entre os itens abertos iguais.
        // Não usa o horário: um pedido recém-lançado (ainda sem horário) e o mesmo pedido depois de gravado na planilha têm a mesma chave.
        function chavePedido(lista, idx) {
            var q0 = lista[idx];
            if (q0.status === 'fechado') return 'fechado|' + idx;
            var base = String(q0.mesa) + '|' + q0.produto;
            var n = 0;
            for (var i = 0; i < idx; i++) {
                var q = lista[i];
                if (q.status !== 'fechado' && String(q.mesa) + '|' + q.produto === base) n++;
            }
            return base + '|' + n;
        }

        function esc(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function brl(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        // observação do pedido (ex.: sem cebola): texto curto, sem quebra de linha
        function limparObs(v) {
            return String(v === undefined || v === null ? '' : v).replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').replace(/^[=+\-@\s]+/, '').trim().substring(0, 60);
        }
        function htmlObs(obs, grande) {
            if (!obs) return '';
            return grande
                ? '<div style="font-size:0.9rem; font-weight:bold; background:#fff; border:2px solid #000; border-radius:0.4rem; padding:0.15rem 0.4rem; margin-top:0.25rem;">📝 ' + esc(obs) + '</div>'
                : '<br><small>📝 ' + esc(obs) + '</small>';
        }
        function ehVip(chave) { return String(chave).indexOf('VIP-') === 0; }
        function ehPessoa(chave) { return String(chave).indexOf(PREFIXO_PESSOA) === 0; }
        function limparNome(n) {
            return String(n || '').replace(/[.|<>&"'`=+@\\]/g, ' ').replace(/\s+/g, ' ').trim().substring(0, 30);
        }
        // "Comanda 003 - Fernando - 11999998888" -> {num:'003', nome:'Fernando', tel:'11999998888'}
        function partesPessoa(n) {
            var m = /^Comanda (T?\d+) - (.*)$/.exec(String(n));
            if (!m) return { num: '', nome: String(n), tel: '' };
            var resto = m[2], t = /^(.*) - (\d{8,})$/.exec(resto);
            return t ? { num: m[1], nome: t[1], tel: t[2] } : { num: m[1], nome: resto, tel: '' };
        }
        // campo de telefone (opcional) antes do 1º pedido: 'pessoa' (grava na chave), 'mesa' (grava na aba Telefones) ou ''
        // nome (só mesas): sugere clientes da aba Clientes e, se o cliente tem telefone lá, preenche o campo
        // clientes com o MESMO nome completo (ex.: 4 "Fernando"): a lista mostra o final do telefone para diferenciar
        function sufixoTel(c) { return ''; } // (não mostramos mais o final do telefone: o bar não decora os números)
        // nome sem sobrenome que já existe na lista: sugere sobrenome ou apelido para não confundir clientes
        function avisoNomeRepetido(txt) {
            var t = limparNome(txt), q = semAcento(t);
            if (!q || q.indexOf(' ') >= 0) return '';
            var existe = estado.clientes.some(function(c) { return semAcento(c.nome) === q; });
            return existe ? '<div style="background:#fef3c7; border:2px solid #b45309; border-radius:0.5rem; padding:0.4rem 0.5rem; margin-top:0.4rem; font-size:0.8rem; color:#000;">⚠️ Já existe um cliente chamado <b>' + esc(t) + '</b>. Se for outra pessoa, acrescente o <b>sobrenome ou apelido</b> (ex.: ' + esc(t) + ' Silva, ' + esc(t) + ' Barba).</div>' : '';
        }
        function achaCliente(nome) {
            var q = semAcento(limparNome(nome));
            if (!q) return null;
            return estado.clientes.find(function(c) { return semAcento(c.nome) === q; }) || null;
        }
        function preencherTelDoCliente(c) {
            var t = document.getElementById('input-tel-pessoa'), ni = document.getElementById('tel-ni');
            if (!c || !c.tel || !t) return;
            estado.telNI = false; if (ni) ni.checked = false;
            t.disabled = false; t.value = c.tel; estado.telCache = c.tel;
        }
        function sugerirNomeMesa(txt) {
            estado.nomeMesaCache = txt;
            var box = document.getElementById('sug-mesa');
            if (!box) return;
            var lista = limparNome(txt) ? filtrarClientes(txt) : [];
            box.innerHTML = lista.length ? '<div style="border:2px solid #000; border-radius:0.5rem; overflow:hidden; margin-top:0.25rem;">' + lista.map(function(c) {
                return '<button type="button" data-nome="' + esc(c.nome) + '" data-tel="' + esc(c.tel || '') + '" onclick="escolherNomeMesa(this.getAttribute(\'data-nome\'), this.getAttribute(\'data-tel\'))" style="display:block; width:100%; text-align:left; background:#fff; border:0; border-bottom:1px solid #ccc; padding:0.5rem; color:#000;">' + esc(c.nome) + (c.tel ? sufixoTel(c) + ' 📞' : '') + '</button>';
            }).join('') + '</div>' : '';
            box.innerHTML += avisoNomeRepetido(txt);
            var ex = achaCliente(txt);
            if (ex && ex.tel && !String(estado.telCache || '').trim()) preencherTelDoCliente(ex);
        }
        function escolherNomeMesa(nome, tel) {
            var inp = document.getElementById('input-nome-mesa');
            if (inp) inp.value = nome;
            estado.nomeMesaCache = nome;
            var box = document.getElementById('sug-mesa'); if (box) box.innerHTML = '';
            if (tel) preencherTelDoCliente({ tel: tel }); else preencherTelDoCliente(achaCliente(nome));
        }
        function telNaoInformado(on) {
            estado.telNI = !!on;
            var t = document.getElementById('input-tel-pessoa');
            if (t) { if (on) { t.value = ''; estado.telCache = ''; } t.disabled = !!on; }
        }
        function tipoCampoTelefone(m) {
            if (!m || m.vip || (m.itens && m.itens.length)) return '';
            if (m.pessoa) { var pp = partesPessoa(m.nome); return (pp.num && !pp.tel) ? 'pessoa' : ''; }
            return 'mesa';
        }
        function todasMesas() { return estado.mesas.concat(estado.pessoas); }
        function acharMesa(id) { return todasMesas().find(function(m) { return String(m.id) === String(id); }); }
        // nome para mostrar na tela
        function nomeMesa(m) {
            if (m.pessoa) {
                var pp = partesPessoa(m.nome);
                if (!m.vip && pp.num) return '👤 ' + pp.nome + ' · Comanda ' + pp.num;
                return (m.vip ? '⭐ ' : '👤 ') + m.nome;
            }
            var r = m.idExibicao || m.id;
            if (m.status === 'livre' && m.contadorFehamentos > 0) r = m.id + '.' + m.contadorFehamentos;
            return 'Comanda ' + r;
        }
        // identificador gravado na coluna A da planilha para novos pedidos
        function chaveMesa(m) {
            if (m.pessoa) return m.id;
            if (m.status === 'livre' && m.contadorFehamentos > 0) return m.id + '.' + m.contadorFehamentos;
            if (m.status === 'ocupada' && m.idExibicao) return m.idExibicao;
            return m.id;
        }
        function totalMesaObj(m) {
            var t = 0;
            for (var i = 0; i < m.itens.length; i++) t += m.itens[i].qnt * m.itens[i].preco;
            return t;
        }

        // ---- modo TESTE (login Queen): pedidos marcados com [TESTE] na observação, mostrados em roxo com a etiqueta TESTE ----
        function souTeste() { return !!(estado.usuario && estado.usuario.supreme); } // papel supreme (coluna C da aba Key)
        function etiquetaTeste() { return '<b style="background:#6d28d9; color:#fff; border-radius:0.3rem; padding:0 0.4rem; font-size:0.75rem; letter-spacing:0.05em;">TESTE</b>'; }
        function mesaTeste(m) { return !!(m && m.itens && m.itens.some(function(it) { return it.teste; })); }
        // cores da lista de produtos: caixa = verde suave, bar = azul suave, cozinha = vermelho suave (+ coração no texto, p/ iPad que ignora a cor)
        function estiloTipo(tipo) {
            var t = String(tipo || 'bar').toLowerCase();
            if (t.indexOf('caixa') >= 0) return { bg: '#dcfce7', ico: '💚 ' };
            if (t.indexOf('cozinha') >= 0 || t.indexOf('petisco') >= 0 || t.indexOf('comida') >= 0) return { bg: '#fee2e2', ico: '❤️ ' };
            return { bg: '#dbeafe', ico: '💙 ' };
        }
        function itemEhCaixa(it) { return String(it.tipo || '').toLowerCase().indexOf('caixa') >= 0; }
        function itemEhCozinha(it) {
            var t = String(it.tipo || 'bar').toLowerCase();
            return t.indexOf('cozinha') >= 0 || t.indexOf('petisco') >= 0 || t.indexOf('comida') >= 0;
        }
        // cor do grupo (bar ou cozinha) da mesa: pronto > preparando > pendente > entregue; branco = sem itens
        function corGrupo(itens, cozinha) {
            var sts = itens.filter(function(it) { return !itemEhCaixa(it) && itemEhCozinha(it) === cozinha; })
                           .map(function(it) { return it.statusPreparo || 'pendente'; });
            if (sts.length === 0) return '#fff';
            return corStatus(sts.indexOf('pronto') >= 0 ? 'pronto' : sts.indexOf('preparando') >= 0 ? 'preparando' : sts.indexOf('pendente') >= 0 ? 'pendente' : 'entregue');
        }
        function bolinha(rotulo, cor) {
            return '<span style="background:' + cor + '; border: 2px solid #000; border-radius: 999px; padding: 0 0.4rem; font-size: 0.65rem; font-weight: bold; color: #000; display: inline-block; line-height: 1.1rem; margin-left: 0.25rem;">' + rotulo + '</span>';
        }

        // estoque disponível = estoque da planilha - pedidos enviados que o servidor ainda não gravou
        function estoqueDisponivel(nome) {
            var p = CARDAPIO.find(function(x) { return x.nome === nome; });
            if (!p) return 0;
            var reservado = 0;
            estado.pendentes.forEach(function(pd) {
                if (pd.pedido.produto === nome && !pd.pedido.teste) reservado += Number(pd.pedido.qnt) || 0; // teste não reserva estoque
            });
            return (Number(p.estoque) || 0) - reservado;
        }
        function primeiroDisponivel() {
            for (var c = 0; c < CARDAPIO.length; c++) {
                if (estoqueDisponivel(CARDAPIO[c].nome) > 0) return CARDAPIO[c].nome;
            }
            return '';
        }
        function desfazerPedido(novo, mensagem) {
            estado.pendentes = estado.pendentes.filter(function(pd) { return pd.pedido !== novo; });
            estado.pedidosGlobais = estado.pedidosGlobais.filter(function(x) { return x !== novo; });
            processarPedidos();
            renderizar();
            alert(mensagem);
            sincronizar();
        }

        function processarPedidos() {
            try {
                // comandas (mesas) existem só enquanto abertas: as que têm pedidos + as recém-criadas
                var idsMesa = {};
                estado.mesasNovas.forEach(function(n) { idsMesa[String(n)] = true; });
                for (var q = 0; q < estado.pedidosGlobais.length; q++) {
                    var pq = estado.pedidosGlobais[q];
                    if (!pq || !pq.mesa || ehPessoa(pq.mesa) || ehVip(pq.mesa)) continue;
                    var bq = String(pq.mesa).split('.')[0];
                    if (/^\d+$/.test(bq)) idsMesa[String(parseInt(bq, 10))] = true;
                }
                var antigas = estado.mesas;
                estado.mesas = Object.keys(idsMesa).map(function(id) {
                    var ex = antigas.find(function(m) { return String(m.id) === id; });
                    return ex || { id: parseInt(id, 10), status: 'livre', itens: [], contadorFehamentos: 0 };
                }).sort(function(a, b) { return a.id - b.id; });
                for (var i = 0; i < estado.mesas.length; i++) {
                    estado.mesas[i].itens = [];
                    estado.mesas[i].status = 'livre';
                    estado.mesas[i].contadorFehamentos = 0;
                    estado.mesas[i].idExibicao = null;
                    estado.mesas[i].abertaEm = '';
                }

                var contagemFechamentos = {};
                var fechSets = {};
                var pessoasMapa = {};
                var finMapa = {}, finLista = [];

                for (var k = 0; k < estado.pedidosGlobais.length; k++) {
                    var p = estado.pedidosGlobais[k];
                    if (!p || !p.mesa) continue;
                    if (typeof p.obs === 'string' && p.obs.indexOf('[TESTE]') === 0) { p.teste = true; p.obs = p.obs.replace(/^\[TESTE\]\s*/, ''); }
                    if (p.status === 'fechado') {
                        var kf = String(p.mesa) + '|' + String(p.tchau);
                        if (!finMapa[kf]) { finMapa[kf] = { k: kf, mesa: String(p.mesa), tchau: String(p.tchau), abertura: p.oi || '', itens: [], total: 0, forma: p.forma || '' }; finLista.push(finMapa[kf]); }
                        if (p.teste) finMapa[kf].teste = true;
                        var pcf = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                        var prf = p.preco || (pcf ? pcf.preco : 0);
                        finMapa[kf].itens.push({ produto: p.produto, qnt: Number(p.qnt || 1), preco: prf, obs: p.obs || '', pedidoEm: p.pedidoEm || p.oi || '' });
                        finMapa[kf].total += Number(p.qnt || 1) * prf;
                    }
                    var baseId = String(p.mesa).split('.')[0];
                    var mesaObj = estado.mesas.find(function(m) { return m.id == baseId; });
                    if (ehPessoa(p.mesa) || ehVip(p.mesa)) {
                        if (p.status === 'fechado') continue;
                        if (!pessoasMapa[p.mesa]) {
                            pessoasMapa[p.mesa] = { id: p.mesa, pessoa: true, vip: ehVip(p.mesa), nome: ehVip(p.mesa) ? String(p.mesa) : String(p.mesa).substring(PREFIXO_PESSOA.length), status: 'ocupada', itens: [], idExibicao: p.mesa, contadorFehamentos: 0, abertaEm: p.oi || '' };
                        }
                        mesaObj = pessoasMapa[p.mesa];
                        var pc = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                        mesaObj.itens.push({ idItem: k, produto: p.produto, qnt: Number(p.qnt || 1), preco: pc ? pc.preco : (p.preco || 0), tipo: p.tipo || 'bar', statusPreparo: p.statusPreparo || 'pendente', linha: p.linha, mesaKey: p.mesa, obs: p.obs || '', teste: !!p.teste });
                        continue;
                    }

                    if (mesaObj) {
                        if (p.status === 'fechado') {
                            fechSets[baseId] = fechSets[baseId] || {};
                            if (!p.teste) { // fechamento de teste não muda o número da mesa
                                fechSets[baseId][String(p.tchau)] = true;
                                contagemFechamentos[baseId] = Object.keys(fechSets[baseId]).length;
                            }
                            mesaObj.status = 'livre';
                        } else {
                            mesaObj.status = 'ocupada';
                            mesaObj.idExibicao = p.mesa;

            fetch(API_URL)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    // resposta mais antiga que outra já aplicada (chegou fora de ordem): descarta, senão o status "volta"
                    if (meuSeq < (estado.seqAplicada || 0)) return;
                    estado.seqAplicada = meuSeq;

                            estado.pendentes = estado.pendentes.filter(function(pd) {
                                if (Date.now() - pd.t > 60000) return false;
                                var n = data.pedidos.filter(function(x) { return x.status !== 'fechado' && String(x.mesa) === String(pd.pedido.mesa) && x.produto === pd.pedido.produto; }).length;
                                return n < pd.base + 1;
                            });
                            estado.pendentes.forEach(function(pd) { data.pedidos.push(pd.pedido); });
                            data.pedidos = aplicarFechando(data.pedidos);
                            estado.pedidosGlobais = data.pedidos;

                            for (var kk = 0; kk < data.pedidos.length; kk++) {
                                var chv = chavePedido(data.pedidos, kk);

                        }

        // Clientes recorrentes (lista da aba "Clientes" da planilha): sugestões ao digitar o começo do nome
        function semAcento(t) { return String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

        // próximo número da comanda (zera a cada dia: a planilha só traz o dia atual). tipo 'VR' = venda rápida, '' = pessoa
        function proximoNumero(tipo) {
            var max = 0, ids = estado.pessoasNovas.slice();
            (estado.pessoas || []).forEach(function(p) { ids.push(p.id); });
            (estado.pedidosGlobais || []).forEach(function(p) { if (p && p.mesa) ids.push(String(p.mesa)); });
            Object.keys(estado.vrOcultas || {}).forEach(function(k) { ids.push(k); });
            ids.forEach(function(id) {
                var m = /^Pessoa: Comanda (\d+) - (VR - )?/.exec(String(id));
                if (!m) return;
                if (tipo === 'VR' ? !!m[2] : !m[2]) max = Math.max(max, parseInt(m[1], 10));
            });
            return max + 1;
        }
        // número da comanda: normal = 001, 002...; Queen (teste) tem a própria contagem T001, T002... e não consome os números reais
        function rotuloNumero(tipo) {
            if (!souTeste()) return fmtNum(proximoNumero(tipo));
            var max = 0, ids = estado.pessoasNovas.slice();
            (estado.pessoas || []).forEach(function(p) { ids.push(p.id); });
            (estado.pedidosGlobais || []).forEach(function(p) { if (p && p.mesa) ids.push(String(p.mesa)); });
            Object.keys(estado.vrOcultas || {}).forEach(function(k) { ids.push(k); });
            ids.forEach(function(id) {
                var m = /^Pessoa: Comanda T(\d+) - (VR - )?/.exec(String(id));
                if (m && (tipo === 'VR' ? !!m[2] : !m[2])) max = Math.max(max, parseInt(m[1], 10));
            });
            return 'T' + fmtNum(max + 1);
        }
        function fmtNum(n) { return (n < 10 ? '00' : n < 100 ? '0' : '') + n; }
        // ---------- + Nova comanda: o atendente digita o número da comanda (cartão físico) ----------
        function numeroEmUso(n) {
            var achou = false;
            todasMesas().forEach(function(m) {

                if (m.vip) return;
                var num = m.pessoa ? String(partesPessoa(m.nome).num).replace(/^T/, '') : String(m.id);
                if (num && parseInt(num, 10) === n && !(m.pessoa && /^Comanda T?\d+ - VR - /.test(m.nome))) achou = true;
            });
            return achou;
        }

        // ---------- GAME (segredo): em "+ Nova Pessoa" digite 1337 no número e GAME no nome ----------
        var jogo = null;
        function iniciarGame() {
            if (jogo) return;
            var el = document.createElement('div');

            var cv = document.createElement('canvas');
            cv.style.cssText = 'display:block; width:100%; height:100%;';
            el.appendChild(cv);
            document.body.appendChild(el);
            var W = el.clientWidth || window.innerWidth, H = el.clientHeight || window.innerHeight;
            cv.width = W; cv.height = H;
            var g = cv.getContext('2d');
            // altura do personagem = altura do botão "Venda rápida"
            var altura = 40, bts = document.getElementsByTagName('button'), b;
            for (b = 0; b < bts.length; b++) { if (String(bts[b].getAttribute('onclick') || '').indexOf('vendaRapida') >= 0 && bts[b].offsetHeight) { altura = bts[b].offsetHeight; break; } }
            var bc = document.getElementById('btn-aba-caixa'), S = (bc && bc.offsetWidth) ? bc.offsetWidth : 150;   // ferramentas: tamanho da caixa amarela "Caixa / Mesas"
            var ic = document.getElementById('icone-foice'), icR = ic ? ic.getBoundingClientRect() : { left: 20, top: 10, width: 24, height: 24 };
            var icX = icR.left + icR.width / 2, icY = icR.top + icR.height / 2, icS = Math.max(16, icR.height);
            var p = altura / 19;                       // 1 "pixel" do boneco
            var BW = 10 * p, BH = 19 * p;              // caixa do corpo (largura, altura)
            var GRAV = altura * 0.03, VEL = Math.max(2, altura * 0.07);
            function velPulo(alt) { return Math.sqrt(2 * GRAV * alt); }
            var obst = [], quadro = 0;
            function lerObstaculos() {
                var lista = document.querySelectorAll('button, .mesa-card, .btn-tab, input, select, h2, h3'), out = [], k, r;
                for (k = 0; k < lista.length; k++) {
                    if (el.contains(lista[k])) continue;
                    r = lista[k].getBoundingClientRect();
                    if (r.width < 8 || r.height < 8 || r.bottom < 0 || r.top > H || r.right < 0 || r.left > W) continue;
                    out.push({ l: r.left, t: r.top, r: r.right, b: r.bottom });
                }
                obst = out;
            }
            lerObstaculos();
            var j = { raf: 0, cabecas: 0, toques: [], fim: false, el: el, h: null, fase: 0, ft: 0, ic: ic };
            jogo = j;
            function novo() {
                return { x: 20 + Math.random() * (W - 40), y: 0, vx: VEL * (Math.random() < 0.5 ? -1 : 1), vy: 0, solo: false, andar: 0, dir: 1, estado: 'vivo', t: 0, cab: null, sang: [], cor: '#009c3b' };
            }
            j.h = novo();
            function bate(x, y) { // caixa do corpo com pés em (x,y) bate em algum ícone?
                var l = x - BW / 2, r = x + BW / 2, t = y - BH, bo = y, k, o;
                for (k = 0; k < obst.length; k++) { o = obst[k]; if (r > o.l && l < o.r && bo > o.t && t < o.b) return o; }
                return null;

            function mover(h) {
                var o;
                // horizontal
                h.x += h.vx;
                if (h.x < BW / 2) { h.x = BW / 2; h.vx = Math.abs(h.vx); }
                if (h.x > W - BW / 2) { h.x = W - BW / 2; h.vx = -Math.abs(h.vx); }
                o = bate(h.x, h.y);
                if (o) {

                    if (h.solo && degrau < BH * 3.2) h.vy = -velPulo(degrau + BH * 0.9); // pula por cima
                    else { h.x = h.vx > 0 ? o.l - BW / 2 - 0.5 : o.r + BW / 2 + 0.5; h.vx = -h.vx; }
                    if (bate(h.x, h.y) && !h.solo) h.x -= h.vx;
                }
                if (h.vx !== 0) h.dir = h.vx > 0 ? 1 : -1;

                h.vy += GRAV; h.y += h.vy; h.solo = false;

                    else { h.y = o.b + BH + 0.5; h.vy = 0; }
                }
                if (h.y >= H) { h.y = H; h.vy = 0; h.solo = true; }
                if (h.solo) {
                    h.andar++;
                    if (Math.random() < 0.012) h.vy = -velPulo(altura * (1.2 + Math.random() * 3.2)); // pulinho ou pulo alto
                    if (Math.random() < 0.004) h.vx = -h.vx;
                }
            }
            function cabeca(x, y, dir) { // (x,y) = centro do topo da cabeça
                g.fillStyle = '#f0c8a0'; g.fillRect(x - 3 * p, y, 6 * p, 6 * p);
                g.fillStyle = '#5a3a1a'; g.fillRect(x - 3 * p, y - p, 6 * p, 2 * p); g.fillRect(x - 3 * p, y, p, 3 * p);
                g.fillStyle = '#000'; g.fillRect(x + (dir > 0 ? 0 : -2) * p, y + 2 * p, p, p); g.fillRect(x + (dir > 0 ? 2 : 0) * p, y + 2 * p, p, p);
            }
            function humano(h) {
                if (h.crush) { g.save(); g.translate(h.x, h.y); g.scale(1.7, 0.16); g.translate(-h.x, -h.y); }

            function humano2(h) {
                var x = Math.round(h.x), y = Math.round(h.y) - 9 * p; // y = centro do corpo (pés em h.y)

                g.fillStyle = '#ffdf00';

        function vrEnviar() {
            var v = estado.vr; if (!v || v.enviando || !v.confirmando) return;

            var vnome = limparNome(v.nome), vtel = String(v.tel || '').replace(/\D/g, '');

            var chave = PREFIXO_PESSOA + 'Comanda ' + rotuloNumero('VR') + ' - VR - ' + vnome + (vtel ? ' - ' + vtel : '') + ' - ' + z(d.getHours()) + ':' + z(d.getMinutes());
            if (!estado.vrOcultas) estado.vrOcultas = {};

                (vteste ? '&teste=1' : '') + (vtel ? '&tel=' + encodeURIComponent(vtel) : (vni ? '&tel=ni' : '')) + (vnome ? '&nome=' + encodeURIComponent(vnome) : '');
            // imprime e fecha a janela na hora; a planilha é atualizada em segundo plano (uma única chamada)

        function fecharJanelaPessoa() {

        }
        function escolherPessoa(valor, tel) {
            var entrada = limparNome(valor);
            if (!entrada) return;
            var cgm = document.getElementById('input-num-comanda');
            if (entrada.toUpperCase() === 'GAME' && cgm && String(cgm.value).replace(/\D/g, '') === '1337') {
                fecharJanelaPessoa(); iniciarGame(); return; // só libera o jogo: não cria comanda
            }
            var ehVipEnt = entrada.toUpperCase() === 'VIP' || entrada.toUpperCase().indexOf('VIP-') === 0;
            if (!ehVipEnt) {
                var cn = document.getElementById('input-num-comanda');
                var nn = parseInt(String(cn ? cn.value : '').replace(/\D/g, ''), 10);
                if (!nn || nn < 1) { alert('Digite o número da comanda.'); if (cn && cn.focus) cn.focus(); return; }
                if (numeroEmUso(nn)) { alert('A comanda ' + nn + ' já está aberta.'); if (cn && cn.focus) cn.focus(); return; }
                estado.numComandaNova = (souTeste() ? 'T' : '') + fmtNum(nn);
            }
            if (!tel) { var cl = achaCliente(entrada); if (cl && cl.tel) tel = cl.tel; } // nome digitado por inteiro e igual a um cliente salvo
            fecharJanelaPessoa();
            criarPessoa(entrada);
            // cliente salvo com telefone na aba Clientes: já vem preenchido no campo de telefone da comanda
            if (tel && tipoCampoTelefone(acharMesa(estado.mesaSelecionadaId)) === 'pessoa') { preencherTelDoCliente({ tel: String(tel) }); } // escreve direto no campo (renderizar() apagaria: ele relê o campo vazio)
        }
        // janela do cliente VIP: busca o nome na lista de clientes da planilha

                '<h3 style="margin-bottom:0.75rem;">⭐ Cliente VIP</h3>' +

        function vipFechar() { var el = document.getElementById('janela-vip'); if (el && el.parentNode) el.parentNode.removeChild(el); }

        function criarPessoa(entrada) {
            var chave;

                // cliente VIP (mensalista): pede o nome e grava como VIP-NOME
                janelaVip();

                chave = up;

                estado.pessoas.some(function(p) { return p.id.toLowerCase() === chaveMin; });
            if (!existe) estado.pessoasNovas.push(chave);
            processarPedidos();
            var alvo = estado.pessoas.find(function(p) { return p.id.toLowerCase() === chaveMin; });

            if (alvo) selecionarMesa(alvo.id);

        function abrirNaCaixa(id) { mudarAba('caixa'); selecionarMesa(id); }

        function adicionarItem() {
            capturarValoresFormulario();
            if (!estado.mesaSelecionadaId) return;
            
            var prod = CARDAPIO.find(function(p) { return p.nome == estado.produtoSelecionadoCache; });
            if (!prod || estoqueDisponivel(prod.nome) <= 0) {
                alert('Selecione um produto na lista antes de lançar.');
                return;
            }

            var qtd = Number(estado.quantidadeCache) || 1;
            var disponivel = estoqueDisponivel(prod.nome);
            if (disponivel <= 0) { alert(prod.nome + ' está esgotado.'); return; }
            if (qtd > disponivel) { alert('Estoque insuficiente de ' + prod.nome + ': restam ' + disponivel + '.'); return; }
            var mesaObj = acharMesa(estado.mesaSelecionadaId);
            if (!mesaObj) return;
            var telEnvio = '', nomeEnvio = '', campoTel = tipoCampoTelefone(mesaObj);
            if (campoTel) {
                var telDig = String(estado.telCache || '').replace(/\D/g, '');
                if (telDig && telDig.length < 8) { alert('Telefone incompleto. Digite com DDD ou deixe em branco.'); var tf = document.getElementById('input-tel-pessoa'); if (tf && tf.focus) tf.focus(); return; }

                if (!telDig && estado.telNI && campoTel === 'mesa') telEnvio = 'ni';
                if (campoTel === 'mesa') { nomeEnvio = limparNome(estado.nomeMesaCache || ''); estado.nomeMesaCache = ''; }
            }
            if (campoTel === 'pessoa' && telDig) {
                var antigo = mesaObj.id, novoId = antigo + ' - ' + telDig;
                estado.pessoasNovas = estado.pessoasNovas.map(function(x) { return x === antigo ? novoId : x; });
                estado.mesaSelecionadaId = novoId;
                estado.telCache = ''; estado.telNI = false;
                processarPedidos();
                mesaObj = acharMesa(novoId);
                if (!mesaObj) return;
            }
            var idMesaFinal = chaveMesa(mesaObj);

            var novo = { 
                mesa: idMesaFinal, 
                produto: prod.nome, 
                qnt: qtd,
                preco: prod.preco,

                teste: souTeste()
            };

            var base = estado.pedidosGlobais.filter(function(x) { return x.status !== 'fechado' && String(x.mesa) === String(novo.mesa) && x.produto === novo.produto; }).length;
            estado.pendentes.push({ pedido: novo, base: base, t: Date.now() });
            estado.pedidosGlobais.push(novo);

            // volta o formulário ao padrão: primeiro produto da lista e quantidade 1

            estado.obsCache = '';

            processarPedidos();

            var urlPedido = API_URL + '?acao=novo_pedido&mesa=' + encodeURIComponent(novo.mesa) +

                (novo.teste ? '&teste=1' : '') + (telEnvio ? '&tel=' + encodeURIComponent(telEnvio) : '') + (nomeEnvio ? '&nome=' + encodeURIComponent(nomeEnvio) : '') +
                (novo.obs ? '&obs=' + encodeURIComponent(novo.obs) : '');
            fetch(urlPedido, { keepalive: true })
                .then(function(res) { return res.json(); })

                    if (r && r.result === 'success') {

                            keepalive: true, body: JSON.stringify(novo) })

        var clickTimers = {};
        function lidarComCliqueCard(idItem) {
            if (clickTimers[idItem]) {
                clearTimeout(clickTimers[idItem]);
                clickTimers[idItem] = null;
                mudarEstadoPorId(idItem, 'pronto');
            } else {
                clickTimers[idItem] = setTimeout(function() {
                    clickTimers[idItem] = null;
                    var p = estado.pedidosGlobais[idItem];
                    if (p && p.status !== 'fechado') {
                        var atual = p.statusPreparo || 'pendente';
                        mudarEstadoPorId(idItem, atual === 'pendente' ? 'preparando' : 'pendente');
                    }
                }, 250);
            }
        }

        function mudarEstadoPorId(idItem, novoEstado) {
            var p = estado.pedidosGlobais[idItem];
            if (p && p.status !== 'fechado') {
                p.statusPreparo = novoEstado;
                var chv = chavePedido(estado.pedidosGlobais, idItem);
                estado.overrides[chv] = { status: novoEstado, t: Date.now(), ult: 0, enviando: false, mesa: p.mesa, produto: p.produto, linha: p.linha };
                enviarStatus(chv);
                processarPedidos();
                renderizar();
            }

        // Envia o status e confere a resposta. A mudança só deixa de ser "reservada" na tela quando

        function enviarStatus(chv) {
            var ov = estado.overrides[chv];
            if (!ov || ov.enviando || !ov.linha) return;
            ov.enviando = true; ov.ult = Date.now();
            var qs = '?acao=status_preparo&linha=' + encodeURIComponent(ov.linha) + '&mesa=' + encodeURIComponent(ov.mesa) +
                '&produto=' + encodeURIComponent(ov.produto) + '&status=' + encodeURIComponent(ov.status);
            fetch(API_URL + qs, { keepalive: true })
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    ov.enviando = false;
                    if (!(r && r.result === 'success') && !(r && r.error)) {
                        // script antigo (não conhece a ação por GET): usa o envio de antes
                        fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ acao: 'status_preparo', linha: ov.linha, mesa: ov.mesa, produto: ov.produto, statusPreparo: ov.status }) });
                    }
                })
                .catch(function() { ov.enviando = false; });

        var cancelando = false;
        function cancelarItem(idItem, qtdRemover) {
            if (cancelando) return;

            if (!p || p.status === 'fechado') return;
            if (!p.linha) { alert('Esse pedido ainda está sendo gravado. Aguarde alguns segundos e tente de novo.'); return; }
            var q = Math.min(Number(qtdRemover) || 1, Number(p.qnt) || 1);
            var msg = q >= p.qnt
                ? 'Cancelar ' + p.qnt + 'x ' + p.produto + '?'
                : 'Remover ' + q + ' un de ' + p.produto + '? (ficam ' + (p.qnt - q) + ')';
            if (!confirm(msg + '\nO estoque será devolvido.')) return;
            cancelando = true;
            fetch(API_URL + '?acao=cancelar_item&linha=' + encodeURIComponent(p.linha) + '&mesa=' + encodeURIComponent(p.mesa) +
                  '&produto=' + encodeURIComponent(p.produto) + '&qnt=' + encodeURIComponent(q))
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    cancelando = false;
                    if (r && r.result === 'success') sincronizar();
                    else if (r && r.error) { alert(r.error); sincronizar(); }
                    else alert('Não foi possível cancelar. Confira se a versão nova do Codigo.gs está implantada.');
                })
                .catch(function() { cancelando = false; alert('Falha de conexão. Tente novamente.'); });
        }

        function encerrarTodas() {
            if (!exigirAdmin()) return;
            var abertas = todasMesas().filter(function(m) { return m.status === 'ocupada' && m.itens.length > 0 && !m.vip; });
            if (abertas.length === 0) { alert('Não há mesas abertas.'); return; }
            if (!confirm('Encerrar ' + abertas.length + ' comanda(s) em aberto, total ' + brl(abertas.reduce(function(a, m) { return a + totalMesaObj(m); }, 0)) + '?')) return;
            var senha = prompt('Digite a senha para encerrar todas as mesas:');
            if (senha === null) return;
            fetch(API_URL + '?acao=encerrar_todas&senha=' + encodeURIComponent(senha))
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    if (r && r.result === 'success') {
                        estado.pessoasNovas = [];
                        estado.mesaSelecionadaId = null;
                        alert(r.mesas + ' comanda(s) encerrada(s). Valor que estava em aberto: ' + (r.totalTexto || ''));

        function finalizarDia() {
            if (!exigirAdmin()) return;
            var mesasOcupadas = todasMesas().filter(function(m) { return m.status === 'ocupada' && m.itens.length > 0 && !m.vip && !mesaTeste(m); }); // comandas de teste abertas não bloqueiam
            if (mesasOcupadas.length > 0) {
                alert("Não é possível finalizar o dia! Ainda existem mesas abertas.\nVá na aba 📋 Abertas e use \"Encerrar todas\" (senha) se for o caso.");
                return;
            }
            var temTeste = (estado.finalizadas || []).some(function(f) { return f.teste || f.forma === 'Teste'; });
            if (souTeste() && temTeste) { abrirJanelaFinalizarDia(); return; }
            var senha = prompt("Digite a senha para finalizar o dia:");
            if (senha === null) return;
            executarFinalizarDia(senha, false);

        // Queen com comandas de teste no dia: pede a senha e se o teste deve ir "completo" para a planilha + impressão

        function fecharJanelaFD() { var el = document.getElementById('janela-fd'); if (el && el.parentNode) el.parentNode.removeChild(el); }

        function executarFinalizarDia(senha, completo) {
            fetch(API_URL + '?acao=finalizar_dia&senha=' + encodeURIComponent(senha) + (completo ? '&teste=1' : ''))
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    if (r && r.result === 'success') {
                        try { imprimirHtml(htmlResumoDia(r, (estado.finalizadas || []).slice()), 'Fechamento do dia'); } catch (eImp) {}
                        estado.pendentes = [];
                        estado.overrides = {};

                        estado.mesaSelecionadaId = null;
                        processarPedidos();
                        renderizar();
                        alert("Dia finalizado!\nTotal de vendas: " + (r.totalTexto || '') +
                            "\nBebidas: " + (r.bebidasTexto || '') + "\nComidas: " + (r.comidasTexto || '') +
                            "\nMesas que ficaram em aberto: " + (r.emAbertoTexto || '') + " (" + (r.nomesAbertas || 'nenhuma') + ")" +
                            "\n\nAs mesas voltaram ao início (Mesa 1, Mesa 2, ...).");
                        estado.pessoasNovas = [];
                        sincronizar();
                    } else {
                        if (r && r.error) alert(r.error);

                        else alert("Não foi possível finalizar o dia.");

                .catch(function() {
                    alert("Falha de conexão. Verifique a internet e tente novamente.");

        // itens ainda não entregues de cada setor (o mesmo que aparece nos cartões do Bar / Cozinha)

            var n = 0, ms = todasMesas();

                } else if (estado.abaAtiva === 'finalizadas') {
                    var finHtml = '', totalFin = 0, porForma = {}, totalVipFin = 0;
                    estado.finalizadas.forEach(function(f) {
                        if (ehVip(f.mesa)) { totalVipFin += f.total; }
                        else if (f.forma === 'Teste') { /* teste: não entra nos totais */ } else { totalFin += f.total; var nf = f.forma || 'Sem forma'; porForma[nf] = (porForma[nf] || 0) + f.total; }
                        var linhasF = f.itens.map(function(it) {
                            return '<div style="display:flex; justify-content:space-between; gap:0.5rem; font-size:0.85rem;"><span>' + it.qnt + 'x ' + esc(it.produto) + (it.obs ? ' <small>(📝 ' + esc(it.obs) + ')</small>' : '') + (soHora(it.pedidoEm) ? ' <small>às ' + esc(soHora(it.pedidoEm)) + '</small>' : '') + '</span><span>' + brl(it.qnt * it.preco) + '</span></div>';
                        }).join('');
                        finHtml += '<div class="mesa-card' + (f.teste || f.forma === 'Teste' ? ' teste' : '') + '" style="height:auto; gap:0.5rem; cursor:default;">' +
                            '<div style="display:flex; justify-content:space-between;"><strong>' + (ehVip(f.mesa) ? '⭐ ' : '') + esc(rotuloChave(f.mesa)) + clienteDaMesaFin(f) + '</strong>' + (f.teste || f.forma === 'Teste' ? etiquetaTeste() : '') + '<strong>' + brl(f.total) + '</strong></div>' +
                            '<small>Aberta: ' + esc(f.abertura) + '<br>Fechada: ' + esc(f.tchau) + (f.forma ? '<br>💳 Pagamento: <b>' + esc(f.forma) + '</b>' : '') + '</small>' +
                            '<div style="display:flex; flex-direction:column; gap:0.25rem;">' + linhasF + '</div>' +
                            '<div style="display:flex; gap:0.5rem;"><button data-k="' + esc(f.k) + '" onclick="imprimirFinalizada(this.getAttribute(\'data-k\'))" style="background:#fff; border:2px solid #000; flex:1;">🖨️ Imprimir</button>' +
                            '<button data-k="' + esc(f.k) + '" onclick="pdfFinalizada(this.getAttribute(\'data-k\'))" style="background:#fff; border:2px solid #000; flex:1;">📄 PDF (Drive)</button>' +
                            (souTeste() && !ehVip(f.mesa) ? '<button data-k="' + esc(f.k) + '" onclick="apagarFinalizada(this.getAttribute(\'data-k\'))" style="background:#7f1d1d; color:#fff; border:2px solid #000;">🗑️ Apagar</button>' : '') + '</div>' +
                        '</div>';
                    });
                    var papel = lerConfig('papel', '80');
                    main.innerHTML = '<div>' +
                        '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem;">' +
                            '<div><h2 style="color:#000;">✅ Comandas finalizadas: ' + estado.finalizadas.length + ' | ' + brl(totalFin) + '</h2>' +
                            '<div style="color:#000; font-size:0.85rem;">' + Object.keys(porForma).map(function(k) { return esc(k) + ': <b>' + brl(porForma[k]) + '</b>'; }).join(' &nbsp;|&nbsp; ') + (totalVipFin > 0 ? '<br>⭐ VIP (mensal, fora do caixa): <b>' + brl(totalVipFin) + '</b>' : '') + '</div></div>' +
                            '<div style="display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap; color:#000; font-size:0.85rem;">' +
                                '<label>Papel: <select onchange="mudarPapel(this.value)" style="width:auto;"><option value="80"' + (papel === '80' ? ' selected' : '') + '>80 mm</option><option value="58"' + (papel === '58' ? ' selected' : '') + '>58 mm</option></select></label>' +
                                '<label>Imprimir em: <select onchange="mudarDestino(this.value)" style="width:auto;"><option value="local"' + (lerConfig('destino', 'local') === 'local' ? ' selected' : '') + '>Este aparelho</option><option value="fila"' + (lerConfig('destino', 'local') === 'fila' ? ' selected' : '') + '>Impressora do bar</option></select></label>' +
                                '<label><input type="checkbox" style="width:auto; display:inline-block; margin-right:0.4rem;" onchange="mudarAutoImp(this)"' + (lerConfig('autoimp', '0') === '1' ? ' checked' : '') + ' style="width:auto;"> Imprimir ao fechar a conta</label>' +
                            '</div>' +
                        '</div>' +
                        (finHtml ? '<div class="mesas-grid">' + finHtml + '</div>' : '<p style="color:#000; font-weight:bold; padding:2rem; text-align:center;">Nenhuma comanda finalizada hoje.</p>') +
                        '<p style="color:#000; font-size:0.8rem; margin-top:1rem;">Ao usar "Finalizar Dia" (com senha) esta lista é zerada. O consumo das contas VIP também fica acumulado na aba VIP da planilha.</p>' +
                    '</div>';
                } else {
                    var ehCozinha = (estado.abaAtiva === 'cozinha');
                    var itensKDS = [];

                    var mesasKDS = todasMesas();
                    for (var x = 0; x < mesasKDS.length; x++) {
                        var mesaObj = mesasKDS[x];
                        if (mesaObj.status === 'ocupada') {
                            for (var y = 0; y < mesaObj.itens.length; y++) {
                                var itemMesa = mesaObj.itens[y];
                                var tipoItem = (itemMesa.tipo || 'bar').toLowerCase();
                                var eCozinhaItem = tipoItem.includes('cozinha') || tipoItem.includes('petisco') || tipoItem.includes('comida');

                                if (itemMesa.statusPreparo !== 'entregue' && !itemEhCaixa(itemMesa) && ((ehCozinha && eCozinhaItem) || (!ehCozinha && !eCozinhaItem))) {
                                    itensKDS.push({
                                        idItem: itemMesa.idItem,
                                        mesa: nomeMesa(mesaObj),
                                        produto: itemMesa.produto,
                                        qnt: itemMesa.qnt,
                                        statusPreparo: itemMesa.statusPreparo || 'pendente',
                                        obs: itemMesa.obs || '',
                                        teste: !!itemMesa.teste
                                    });
                                }
                            }
                        }
                    }

                    // mais novo primeiro: a posição do item na lista segue a ordem de chegada na planilha
                    itensKDS.sort(function(a, b) { return b.idItem - a.idItem; });

                    var kdsHtml = '';
                    if (itensKDS.length === 0) {
                        kdsHtml = '<p style="grid-column: span 4; text-align: center; padding: 3rem; color:#000; font-weight:bold;">Nenhum item pendente no momento.</p>';
                    } else {
                        for (var z = 0; z < itensKDS.length; z++) {
                            var kItem = itensKDS[z];
                            var classePreparo = kItem.statusPreparo;
                            
                            kdsHtml += '<div class="kds-card ' + classePreparo + (kItem.teste ? ' teste' : '') + '" onclick="lidarComCliqueCard(' + kItem.idItem + ')">' +
                                '<div style="display: flex; justify-content: space-between;"><span class="badge">' + esc(kItem.mesa) + (kItem.teste ? ' ' + etiquetaTeste() : '') + '</span><span style="font-size:0.75rem; font-weight:bold;">' + kItem.statusPreparo.toUpperCase() + '</span></div>' +
                                '<div><div style="font-size: 1.2rem; font-weight: bold;">' + kItem.qnt + 'x ' + esc(kItem.produto) + '</div>' + htmlObs(kItem.obs, true) + '</div>' +
                                '<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">' +
                                    '<span style="font-size: 0.65rem; font-weight: bold;">1 toque: preparando | 2 toques: pronto</span>' +
                                    '<button class="btn-acao-entregue" onclick="event.stopPropagation(); mudarEstadoPorId(' + kItem.idItem + ', \'entregue\')">Marcar Entregue</button>' +
                                '</div>' +
                            '</div>';
                        }
                    }

                    var tituloPainel = ehCozinha ? '🍳 Cozinha' : '🍻 Bar';
                    main.innerHTML = '<div><h2 style="margin-bottom: 1rem; color:#000;">' + tituloPainel + '</h2><div class="kds-grid">' + kdsHtml + '</div></div>';
                }
                var btnBar2 = document.getElementById('btn-aba-bar'), btnCoz2 = document.getElementById('btn-aba-cozinha');
                if (btnBar2) { var nBar = contarKDS(false); btnBar2.textContent = '🍻 Bar' + (nBar > 0 ? ' (' + nBar + ')' : ''); }
                if (btnCoz2) { var nCoz = contarKDS(true); btnCoz2.textContent = '🍳 Cozinha' + (nCoz > 0 ? ' (' + nCoz + ')' : ''); }
                var btnAb = document.getElementById('btn-aba-abertas');
                if (btnAb) {
                    var nAb = todasMesas().filter(function(m) { return m.status === 'ocupada' && m.itens.length > 0 && !m.vip; }).length;
                    btnAb.textContent = '📋 Abertas' + (nAb > 0 ? ' (' + nAb + ')' : '');
                }
                var btnFn = document.getElementById('btn-aba-finalizadas');
                if (btnFn) btnFn.textContent = '✅ Finalizadas' + (estado.finalizadas.length > 0 ? ' (' + estado.finalizadas.length + ')' : '');
            } catch (err) {
                console.log("Erro crítico no renderizar:", err);
            }
        }


        // ---------- estação de impressão (abrir com ?estacao=1 no notebook que tem a impressora) ----------
        function iniciarEstacao() {
            var impressas = 0, ocupado = false, fila = [], rodando = false;
            document.querySelector('main').innerHTML = '<div style="text-align:center; color:#fff; padding:2rem;"><h1>🖨️ Estação de impressão</h1>' +
                '<p style="font-size:1.1rem;">Deixe esta tela aberta. Os pedidos de impressão dos iPads saem aqui sozinhos.</p>' +
                '<div id="est-status" style="font-size:1.5rem; font-weight:bold; margin:1.5rem 0;">Aguardando...</div>' +
                '<div id="est-ultima" style="font-size:0.95rem;"></div></div>';
            function z(n) { return (n < 10 ? '0' : '') + n; }
            function marcar(txt, ok) {
                var el = document.getElementById('est-status');
                if (el) { el.textContent = txt; el.style.color = ok ? '#bbf7d0' : '#fecaca'; }
            }
            function proximo() {
                if (rodando || !fila.length) return;
                rodando = true;
                var j = fila.shift();
                imprimirLocal(j.html);
                impressas++;
                var d = new Date();
                var u = document.getElementById('est-ultima');
                if (u) u.textContent = 'Última impressão: ' + (j.titulo || 'comanda') + ' às ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ' (total hoje: ' + impressas + ')';
                setTimeout(function() { rodando = false; proximo(); }, 2500);
            }
            function buscar() {
                if (ocupado) return;
                ocupado = true;
                fetch(API_URL + '?acao=fila_pegar')
                    .then(function(res) { return res.json(); })
                    .then(function(r) {
                        ocupado = false;
                        if (r && r.result === 'success') {
                            marcar('✅ Conectado — aguardando pedidos', true);
                            (r.jobs || []).forEach(function(j) { fila.push(j); });
                            proximo();
                        } else { marcar('⚠️ Erro: ' + ((r && r.error) || 'resposta inválida'), false); }
                    })
                    .catch(function() { ocupado = false; marcar('⚠️ Sem conexão ou sem login', false); });
            }
            buscar();
            setInterval(buscar, 3000);
        }

        // Executa imediatamente e sincroniza em segundo plano
        if (ESTACAO) {
            if (!CHAVE) pedirChave('');
            iniciarEstacao();
        } else {
            renderizar();
            if (!CHAVE) pedirChave('');
            sincronizar();
            setInterval(sincronizar, 5000);
        }
    </script>
</body>
